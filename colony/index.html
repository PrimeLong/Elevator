<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Колония</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1712;color:#f1e6d0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{display:flex;flex-wrap:wrap;gap:3px 12px;align-items:center;padding:5px 8px;background:#2a2219;border-bottom:1px solid #4a3c2c;font-size:13px;flex:none}
.stat{display:flex;align-items:center;gap:4px;white-space:nowrap}
.stat b{font-weight:600}
.dim{opacity:.6;font-size:11px}
.bar{width:64px;height:8px;background:#0007;border-radius:4px;overflow:hidden;display:inline-block}
.bar>i{display:block;height:100%;width:50%;background:#7c5;transition:width .2s}
.sp{flex:1}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bottom{touch-action:pan-x;display:flex;gap:6px;padding:5px 6px;background:#2a2219;border-top:1px solid #4a3c2c;overflow-x:auto;align-items:stretch;flex:none;scrollbar-width:thin}
.grp{display:flex;flex-direction:column;gap:2px;padding:2px 4px 3px;border-radius:8px;background:#0003;flex:none}
.grp>label{font-size:10px;opacity:.55;padding-left:2px;white-space:nowrap}
.row{display:flex;gap:3px}
.btn{background:#3b3024;border:1px solid #5b4a36;color:inherit;border-radius:7px;padding:3px 6px;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;line-height:1.15;position:relative;font-family:inherit}
.btn small{font-size:10px;opacity:.85;white-space:nowrap}
.btn:hover{border-color:#a8875a}
.btn.on{background:#6b5232;border-color:#f0b860;box-shadow:0 0 0 1px #f0b860 inset}
.btn.na{opacity:.45}
.btn .q{position:absolute;top:-5px;right:-4px;background:#d9a85a;color:#2a1a0a;font-size:10px;font-weight:700;border-radius:8px;padding:0 4px}
.tbtn{background:#3b3024;border:1px solid #5b4a36;color:inherit;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer;font-family:inherit}
.tbtn.on{background:#6b5232;border-color:#f0b860}
#toasts{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;max-width:70%}
.toast{background:#000c;padding:5px 10px;border-radius:6px;font-size:13px;border-left:3px solid #aaa;animation:tin .25s ease-out;transition:opacity .5s}
.toast.good{border-color:#6c6}.toast.bad{border-color:#e55}.toast.warn{border-color:#eb4}.toast.info{border-color:#6ae}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#hint{position:absolute;left:8px;bottom:6px;font-size:12px;background:#0008;padding:3px 8px;border-radius:6px;pointer-events:none;max-width:80%}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10;padding:10px}
#ov.show{display:flex}
#ov .panel{touch-action:pan-y}
.panel{background:#2a2219;border:1px solid #6b5232;border-radius:12px;padding:18px 20px;max-width:min(760px,96vw);max-height:92dvh;overflow:auto;box-shadow:0 10px 40px #000a}
.panel h1{font-size:30px;margin-bottom:6px;letter-spacing:1px}
.panel h2{font-size:20px;margin-bottom:10px}
.panel p,.panel li{font-size:14px;line-height:1.45;margin-bottom:6px;opacity:.92}
.panel ul{padding-left:20px;margin-bottom:8px}
.big{background:#7a5a2a;border:1px solid #f0b860;color:#fff;border-radius:8px;padding:9px 18px;font-size:16px;cursor:pointer;margin:6px 6px 0 0;font-family:inherit}
.big.alt{background:#3b3024;border-color:#6b5232}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.mcard{background:#0003;border:1px solid #5b4a36;border-radius:10px;padding:10px}
.mcard h3{font-size:15px;margin-bottom:4px}
.mcard .pips{margin:4px 0;letter-spacing:2px}
.mcard p{font-size:12px;opacity:.8;margin-bottom:6px}
.mcard button{width:100%}
.mcard.locked{opacity:.5}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 20px;margin:10px 0;font-size:14px}
.stats div:nth-child(even){text-align:right;font-weight:600}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:6px 0 10px}
@media (max-width:600px){#top{font-size:11px;gap:2px 8px}.btn{min-width:42px;font-size:14px}.bar{width:44px}.toast{font-size:11px;padding:3px 7px}#toasts{max-width:88%}#hint{font-size:10px}}
</style>
</head>
<body>
<div id="top">
  <span class="stat" title="Листья на складе / вместимость. В скобках — чистый прирост в секунду">🍃 <b id="sFood">0</b><span class="dim" id="sFoodCap">/250</span> <span class="dim" id="sFoodRate"></span></span>
  <span class="stat" title="Биомасса: из неё выращиваются муравьи и мутации">🧬 <b id="sBio">0</b> <span class="dim" id="sBioRate"></span></span>
  <span class="stat" title="Рабочие">🐜<b id="sW">0</b></span>
  <span class="stat" title="Разведчики">🔭<b id="sS">0</b></span>
  <span class="stat" title="Солдаты">⚔️<b id="sSo">0</b></span>
  <span class="stat" title="Строители">🔨<b id="sB">0</b></span>
  <span class="stat" title="Население / вместимость гнезда (перенаселение снижает настроение)">👥 <b id="sPop">0</b><span class="dim" id="sCap">/25</span></span>
  <span class="stat" title="Настроение колонии. Ниже 20 — риск бунта">
    <span id="sMoodE">😊</span><span class="bar"><i id="sMoodB"></i></span><b id="sMood">70</b></span>
  <span class="stat" title="Здоровье матки">👑 <span class="bar"><i id="sQueenB" style="background:#d9a85a"></i></span></span>
  <span class="stat" title="Сезон и год"><span id="sSeasonI">🌸</span> <b id="sSeason">Весна</b> <span class="dim" id="sYear">год 1</span> <span class="bar"><i id="sSeasonB" style="background:#9bd"></i></span></span>
  <span class="stat" title="Сезонов пережито">🗓 <b id="sSurv">0</b></span>
  <span class="stat" id="sWeather" title="Погода"></span>
  <span class="stat" id="sInf" title="Заражённые / зомби" style="color:#d68cf0"></span>
  <span class="stat" title="Доля ваших муравьёв среди всех колоний на карте">🏆 <b id="sDom">0%</b></span>
  <span class="sp"></span>
  <span class="stat">
    <button class="tbtn" id="bPause" title="Пауза (Пробел)">⏸</button>
    <button class="tbtn spd on" data-s="1">1×</button>
    <button class="tbtn spd" data-s="2">2×</button>
    <button class="tbtn spd" data-s="4">4×</button>
    <button class="tbtn" id="bMenu" title="Меню (Esc)">☰</button>
  </span>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="toasts"></div>
  <div id="hint"></div>
</div>
<div id="bottom">
  <div class="grp"><label>Феромоны</label><div class="row">
    <button class="btn tool" data-tool="trail" title="Тропа за едой (1): рабочие идут по ней от гнезда и ищут листья в её конце">🟢<small>Тропа</small></button>
    <button class="btn tool" data-tool="war" title="Тропа войны (2): солдаты идут по ней и атакуют всё в её конце — например, вражеское гнездо">🔴<small>Война</small></button>
    <button class="btn tool" data-tool="erase" title="Ластик (3): стирает следы. Клик по центру незавершённой постройки или карантина — снести">🧽<small>Ластик</small></button>
    <button class="btn tool" data-tool="pan" title="Обзор (5): перетаскивать карту. Колесо / два пальца — масштаб">✋<small>Обзор</small></button>
  </div></div>
  <div class="grp"><label>Постройки (строят строители)</label><div class="row" id="buildRow"></div></div>
  <div class="grp"><label>Эпидемия</label><div class="row">
    <button class="btn tool" data-tool="burn" title="Сжечь (4): огонь убивает всех муравьёв в круге (и своих!), уничтожает споры. Цена: 10🧬 + 5🍃">🔥<small>Сжечь</small></button>
  </div></div>
  <div class="grp"><label>Выращивание (матка)</label><div class="row" id="casteRow"></div></div>
  <div class="grp"><label>Эволюция</label><div class="row">
    <button class="btn" id="bMut" title="Дерево мутаций (M)">🧬<small>Мутации</small></button>
  </div></div>
  <div class="grp"><label>Режим работы</label><div class="row">
    <button class="btn" id="bMode" title="Отдых: медленнее, но настроение растёт. Аврал: быстрее, но муравьи выматываются">⚖️<small>Норма</small></button>
  </div></div>
  <div class="grp"><label>Грибная ферма</label><div class="row">
    <button class="btn" id="bFarm" title="Сколько листьев перерабатывать в биомассу. Выключите, чтобы копить еду к зиме">🍄<small>100%</small></button>
  </div></div>
</div>
<div id="ov"><div class="panel" id="ovp"></div></div>

<script>
'use strict';
// ===================== КОНСТАНТЫ =====================
const W=1600,H=1000,CS=8,GW=W/CS,GH=H/CS,GN=GW*GH;
const FS=25,FW=W/FS,FH=H/FS;
const HS=32,HW=Math.ceil(W/HS),HH=Math.ceil(H/HS);
const NEST_R=34;
const SEASON_LEN=90;
const SEASONS=[{n:'Весна',i:'🌸'},{n:'Лето',i:'☀️'},{n:'Осень',i:'🍂'},{n:'Зима',i:'❄️'}];
const TYPES={
  worker:{name:'Рабочий',icon:'🐜',cost:5,hp:10,dmg:1.5,spd:40,up:0.02,size:1,drain:2},
  scout:{name:'Разведчик',icon:'🔭',cost:8,hp:8,dmg:1,spd:56,up:0.025,size:.9,drain:1.6},
  soldier:{name:'Солдат',icon:'⚔️',cost:12,hp:35,dmg:6,spd:34,up:0.045,size:1.3,drain:1.1},
  builder:{name:'Строитель',icon:'🔨',cost:10,hp:14,dmg:1.5,spd:32,up:0.03,size:1.08,drain:1},
  zombie:{name:'Зомби',icon:'🧟',cost:0,hp:20,dmg:2,spd:15,up:0,size:1.05,drain:0}
};
const CASTES=['worker','scout','soldier','builder'];
const BUILD={
  farm:{name:'Грибная ферма',icon:'🍄',food:40,bio:10,work:20,r:16,desc:'+0.8/с переработки листьев в биомассу'},
  chamber:{name:'Камера отдыха',icon:'🛏️',food:30,bio:0,work:15,r:14,desc:'+15 мест в гнезде, быстрее отдых, +настроение'},
  store:{name:'Склад',icon:'📦',food:25,bio:0,work:12,r:14,desc:'+250 к запасу листьев (на зиму)'},
  isolator:{name:'Изолятор',icon:'💉',food:20,bio:15,work:15,r:13,desc:'Замеченные заражённые уходят сюда и гибнут, не рассеивая споры'},
  quarantine:{name:'Карантин',icon:'🚧',food:15,bio:0,work:6,r:60,desc:'Кольцо-барьер: никто не входит и не выходит, споры не идут наружу. Ставится вдали от гнезда'}
};
const MUTS=[
  {id:'speed',name:'Быстрые ноги',icon:'🦵',cost:[30,70],desc:['+25% скорости всех муравьёв','Ещё +25% скорости']},
  {id:'carry',name:'Большая грузоподъёмность',icon:'💪',cost:[35,80],desc:['Рабочие несут 2 листа','Рабочие несут 3 листа']},
  {id:'sense',name:'Острое чутьё',icon:'👃',cost:[25,60],desc:['Чуют слабые следы (тропы живут дольше), дальше видят еду','Заражённые видны сразу, ещё дальше обзор']},
  {id:'acid',name:'Кислотный укус',icon:'🧪',cost:[40,90],desc:['+50% урона всех муравьёв','Ещё +50% урона, солдаты плюются кислотой']},
  {id:'armor',name:'Хитиновый панцирь',icon:'🛡️',cost:[45,95],desc:['+40% здоровья новых муравьёв','Ещё +40% здоровья'],req:['acid',1]},
  {id:'immune',name:'Антигрибковые железы',icon:'🩺',cost:[40,85],desc:['−35% шанс заражения спорами','Ещё −35% шанс заражения'],req:['sense',1]}
];
const MUT_UPKEEP=0.12;
const RCOL=['#a8261a','#27479e','#6c2fa3','#c46a10','#0f6e60','#8a1d5a'];
const PCOL='#21140c';
const MODES=[{n:'Отдых',i:'😌',thr:60},{n:'Норма',i:'⚖️',thr:35},{n:'Аврал',i:'🔥',thr:8}];

const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>(ax-bx)*(ax-bx)+(ay-by)*(ay-by);
const cellOf=(x,y)=>(clamp(y/CS|0,0,GH-1))*GW+clamp(x/CS|0,0,GW-1);

let G=null;

// ===================== СОЗДАНИЕ ИГРЫ =====================
function newGame(){
  G={
    t:0,speed:1,paused:false,over:false,nid:1,
    food:50,bio:30,season:0,seasonT:0,year:1,seasonsSurvived:0,
    weather:null,wT:0,wCD:rnd(25,40),
    mood:70,rebel:0,workMode:1,farmMode:2,
    muts:{speed:0,carry:0,sense:0,acid:0,armor:0,immune:0},
    queue:[],broodT:0,
    ants:[],colonies:[],foods:[],buildings:[],quars:[],stalks:[],fx:[],
    phero:new Float32Array(GN),war:new Float32Array(GN),spores:new Float32Array(GN),
    distF:new Int16Array(GN),distW:new Int16Array(GN),blocked:new Uint8Array(GN),
    exitsF:[],exitsW:[],trailOK:false,warOK:false,
    fog:new Uint8Array(FW*FH),fogDirty:true,
    fT:0,bfsT:0,fogT:0,infT:100,nestInfT:0,starve:0,starveKill:0,
    inc:0,incT:0,incRate:0,conv:0,convRate:0,upkeep:0,
    cnt:{worker:0,scout:0,soldier:0,builder:0},pop:0,zombies:0,infected:0,
    nFarm:0,nCham:0,nStore:0,isolator:null,
    threat:false,nestHitT:0,dominantShown:false,
    stats:{collected:0,born:0,lost:0,killed:0,nests:0,maxPop:0,burned:0,infected:0,rebellions:0,isolated:0,raids:0},
    toastCD:{}
  };
  const pc={id:0,name:'Ваша колония',x:430,y:520,hp:300,maxhp:300,color:PCOL,alive:true,player:true};
  G.colonies.push(pc);
  addRival(1330,250,'Рыжие муравьи',false);
  genFoods();
  for(let i=0;i<8;i++)mkAnt(0,'worker',pc.x,pc.y);
  mkAnt(0,'scout',pc.x,pc.y);
  for(let i=0;i<2;i++)mkAnt(0,'soldier',pc.x,pc.y);
  for(let i=0;i<2;i++)mkAnt(0,'builder',pc.x,pc.y);
  revealCircle(pc.x,pc.y,230);
  recalcBuildings();
  runBFS();
  fitCam(true);
  setTool('trail');
  updateUI(true);
}

function genFoods(){
  const pc=G.colonies[0];
  const ok=(x,y,m)=>{
    if(x<40||y<40||x>W-40||y>H-40)return false;
    for(const c of G.colonies)if(d2(x,y,c.x,c.y)<110*110)return false;
    for(const f of G.foods)if(d2(x,y,f.x,f.y)<m*m)return false;
    return true;
  };
  // рядом с гнездом
  for(let i=0,k=0;i<4&&k<200;k++){
    const a=rnd(0,6.28),r=rnd(120,210),x=pc.x+Math.cos(a)*r,y=pc.y+Math.sin(a)*r;
    if(ok(x,y,70)){addFood('plant',x,y);i++;}
  }
  for(let i=0,k=0;i<28&&k<2000;k++){const x=rnd(40,W-40),y=rnd(40,H-40);if(ok(x,y,75)){addFood('plant',x,y);i++;}}
  for(let i=0,k=0;i<6&&k<1000;k++){const x=rnd(40,W-40),y=rnd(40,H-40);if(ok(x,y,75)){addFood('berry',x,y);i++;}}
  for(let i=0,k=0;i<2&&k<1000;k++){const x=rnd(40,W-40),y=rnd(40,H-40);if(ok(x,y,75)){addFood('bug',x,y);i++;}}
}
function addFood(type,x,y){
  let f;
  if(type==='plant'){const m=rnd(28,45);f={type,x,y,amt:m,max:m,r:15,val:2,seed:Math.random()*9};}
  else if(type==='berry'){f={type,x,y,amt:18,max:18,r:12,val:4,seed:Math.random()*9};}
  else {const m=rnd(50,80);f={type:'bug',x,y,amt:m,max:m,r:12,val:2,seed:Math.random()*6.28};}
  G.foods.push(f);return f;
}

function addRival(x,y,name,rebel){
  const id=G.colonies.length;
  const hp=rebel?120:250+60*(G.year-1);
  const c={id,name,x,y,hp,maxhp:hp,food:rebel?0:40,color:RCOL[(id-1)%RCOL.length],alive:true,rebel,
    spawnT:5,raidT:rebel?rnd(120,160):rnd(200,240),raiding:false,starveT:0,pop:0,sold:0};
  G.colonies.push(c);
  if(!rebel){
    for(let i=0;i<6;i++)mkAnt(id,'worker',x,y);
    for(let i=0;i<2+G.year;i++)mkAnt(id,'soldier',x,y);
  }
  return c;
}

function findSite(minP,minO){
  const pc=G.colonies[0];let best=null,bs=-1;
  for(let k=0;k<300;k++){
    const x=rnd(90,W-90),y=rnd(90,H-90);
    const dp=Math.sqrt(d2(x,y,pc.x,pc.y));
    let dmin=dp;
    for(const c of G.colonies)if(c.alive&&c.id)dmin=Math.min(dmin,Math.sqrt(d2(x,y,c.x,c.y)));
    for(const q of G.quars)dmin=Math.min(dmin,Math.sqrt(d2(x,y,q.x,q.y))-q.r);
    if(dp>=minP&&dmin>=minO)return{x,y};
    const s=Math.min(dp/minP,dmin/minO);if(s>bs){bs=s;best={x,y};}
  }
  return best;
}

function mkAnt(col,type,x,y){
  const T=TYPES[type];
  let hp=T.hp;
  if(col===0)hp*=1+0.4*G.muts.armor;else hp*=1+0.1*(G.year-1);
  const a={id:G.nid++,col,type,x:x+rnd(-6,6),y:y+rnd(-6,6),a:rnd(0,6.28),hp,maxhp:hp,energy:100,
    state:'nest',timer:rnd(0.3,2.5),carry:0,carryCol:null,tx:x,ty:y,target:null,food:null,job:null,
    inf:0,infT:0,det:false,resting:false,life:0,cell:-1,prev:null,detT:0,detX:0,detY:0,dead:false,raider:false,spitT:0};
  G.ants.push(a);return a;
}

// ===================== ПОЛЯ: ФЕРОМОНЫ, СПОРЫ, BFS =====================
function senseTH(){return [0.08,0.05,0.03][G.muts.sense];}
function runBFS(){
  bfs(G.phero,G.distF,G.exitsF);
  bfs(G.war,G.distW,G.exitsW);
  G.trailOK=G.exitsF.length>0&&G.maxD>=3;
  G.warOK=G.exitsW.length>0&&G._maxW>=3;
}
const bq=new Int32Array(GN);
function bfs(field,dist,exits){
  const th=senseTH(),pc=G.colonies[0],bl=G.blocked;
  dist.fill(-1);exits.length=0;
  let h=0,t=0;
  const r=NEST_R/CS;
  const cx=pc.x/CS,cy=pc.y/CS;
  for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){
    if(x<0||y<0||x>=GW||y>=GH)continue;
    if((x+.5-cx)**2+(y+.5-cy)**2<=r*r){const i=y*GW+x;dist[i]=0;bq[t++]=i;}
  }
  let maxD=0;
  while(h<t){
    const i=bq[h++],x=i%GW,y=(i/GW)|0,d=dist[i]+1;
    for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=GH)continue;
      for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=GW)continue;
        const n=ny*GW+nx;
        if(dist[n]>=0||field[n]<th||bl[n])continue;
        dist[n]=d;bq[t++]=n;if(d===1)exits.push(n);if(d>maxD)maxD=d;
      }}
  }
  if(field===G.phero)G.maxD=maxD;else G._maxW=maxD;
}

function updFields(dt){
  let k=0.025;
  if(G.weather==='rain')k*=4;
  if(G.season===3)k*=1.3;
  const dec=Math.exp(-k*dt);
  let sk=1/60;if(G.weather==='drought')sk=1/22;if(G.season===3)sk=1/25;
  const sdec=Math.exp(-sk*dt);
  const P=G.phero,Wf=G.war,S=G.spores,B=G.blocked;
  const diff=(G.weather==='rain'?0.3:0.15)*dt*4;
  for(let i=0;i<GN;i++){
    let p=P[i];if(p>0){p*=dec;P[i]=p<0.005?0:p;}
    let w=Wf[i];if(w>0){w*=dec;Wf[i]=w<0.005?0:w;}
    let s=S[i];
    if(s>0){
      s*=sdec;if(s<0.01){S[i]=0;continue;}
      // споры расползаются по тропам
      if(s>0.06&&(p>0.1||w>0.1)){
        const r=Math.random()*4|0;
        const n=r===0?i-1:r===1?i+1:r===2?i-GW:i+GW;
        if(n>=0&&n<GN&&(P[n]>0.1||Wf[n]>0.1)&&B[n]===B[i]){const m=s*diff;S[n]+=m;s-=m;}
      }
      S[i]=s;
    }
  }
}
function burst(x,y,rad,amt){
  const gx=x/CS|0,gy=y/CS|0,r=Math.ceil(rad);
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const nx=gx+dx,ny=gy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
    const dd=Math.sqrt(dx*dx+dy*dy);if(dd>rad)continue;
    const i=ny*GW+nx;G.spores[i]=Math.min(3,G.spores[i]+amt*(1-dd/(rad+1)));
  }
}

function stamp(x,y,rad,mode){
  const r=rad/CS,gx=x/CS,gy=y/CS;
  for(let cy=Math.floor(gy-r);cy<=Math.ceil(gy+r);cy++)for(let cx=Math.floor(gx-r);cx<=Math.ceil(gx+r);cx++){
    if(cx<0||cy<0||cx>=GW||cy>=GH)continue;
    const dd=(cx+.5-gx)**2+(cy+.5-gy)**2;if(dd>r*r)continue;
    const i=cy*GW+cx;
    if(mode==='erase'){G.phero[i]=0;G.war[i]=0;}
    else if(mode==='trail')G.phero[i]=1;
    else if(mode==='war')G.war[i]=1;
  }
  G.bfsT=Math.min(G.bfsT,0.05);
}
function paintLine(a,b,mode){
  const rad=mode==='erase'?22:10;
  const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/4));
  for(let i=0;i<=n;i++)stamp(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n,rad,mode);
}

function recalcBlocked(){
  G.blocked.fill(0);
  G.quars.forEach((q,k)=>{
    const r=q.r/CS,gx=q.x/CS,gy=q.y/CS;
    for(let cy=Math.floor(gy-r);cy<=Math.ceil(gy+r);cy++)for(let cx=Math.floor(gx-r);cx<=Math.ceil(gx+r);cx++){
      if(cx<0||cy<0||cx>=GW||cy>=GH)continue;
      if((cx+.5-gx)**2+(cy+.5-gy)**2<=r*r)G.blocked[cy*GW+cx]=k+1;
    }
  });
}
function qOf(x,y){for(let k=0;k<G.quars.length;k++){const q=G.quars[k];if(d2(x,y,q.x,q.y)<q.r*q.r)return k+1;}return 0;}

function recalcBuildings(){
  const done=G.buildings.filter(b=>b.done);
  G.nFarm=done.filter(b=>b.type==='farm').length;
  G.nCham=done.filter(b=>b.type==='chamber').length;
  G.nStore=done.filter(b=>b.type==='store').length;
  G.isolator=done.find(b=>b.type==='isolator')||null;
  G.quars=done.filter(b=>b.type==='quarantine');
  recalcBlocked();
  G.bfsT=0;
}
const foodCap=()=>250+250*G.nStore;
const popCap=()=>25+15*G.nCham;
const mutLevels=()=>Object.values(G.muts).reduce((a,b)=>a+b,0);
const mutMul=()=>1+MUT_UPKEEP*mutLevels();

// ===================== ТУМАН =====================
function revealCircle(x,y,r){
  const gx=x/FS,gy=y/FS,rr=r/FS;
  for(let cy=Math.floor(gy-rr);cy<=Math.ceil(gy+rr);cy++)for(let cx=Math.floor(gx-rr);cx<=Math.ceil(gx+rr);cx++){
    if(cx<0||cy<0||cx>=FW||cy>=FH)continue;
    const i=cy*FW+cx;if(G.fog[i])continue;
    if((cx+.5-gx)**2+(cy+.5-gy)**2<=rr*rr){G.fog[i]=1;G.fogDirty=true;}
  }
}
const seen=(x,y)=>G.fog[clamp(y/FS|0,0,FH-1)*FW+clamp(x/FS|0,0,FW-1)]===1;

// ===================== ПРОСТРАНСТВЕННЫЙ ХЭШ =====================
const hash=[];for(let i=0;i<HW*HH;i++)hash.push([]);
function buildHash(){
  for(let i=0;i<hash.length;i++)hash[i].length=0;
  const pc=G.colonies[0];let threat=false;
  for(const a of G.ants){
    if(a.dead||a.state==='nest')continue;
    hash[clamp(a.y/HS|0,0,HH-1)*HW+clamp(a.x/HS|0,0,HW-1)].push(a);
    if(a.col!==0&&!threat&&d2(a.x,a.y,pc.x,pc.y)<140*140)threat=true;
  }
  G.threat=threat;
}
function nearestHostile(a,r){
  const x0=clamp((a.x-r)/HS|0,0,HW-1),x1=clamp((a.x+r)/HS|0,0,HW-1),y0=clamp((a.y-r)/HS|0,0,HH-1),y1=clamp((a.y+r)/HS|0,0,HH-1);
  let best=null,bd=r*r;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const b=hash[y*HW+x];
    for(let k=0;k<b.length;k++){const e=b[k];
      if(e.dead||e.col===a.col)continue;
      const dd=d2(a.x,a.y,e.x,e.y);if(dd<bd){bd=dd;best=e;}
    }
  }
  return best;
}

// ===================== ДВИЖЕНИЕ =====================
function spdOf(a){
  const T=TYPES[a.type];let s=T.spd;
  if(a.col===0){
    s*=1+0.25*G.muts.speed;
    if(G.workMode===2&&a.type==='worker')s*=1.2;
    if(G.workMode===0)s*=0.9;
    if(a.energy<=0)s*=0.5;
  }else if(a.col>0)s*=1+0.04*(G.year-1);
  if(G.season===3)s*=0.7;
  if(G.weather==='rain')s*=0.85;
  return s;
}
function steer(a,tx,ty,dt){
  if(a.detT>0){a.detT-=dt;tx=a.detX;ty=a.detY;}
  const dx=tx-a.x,dy=ty-a.y,d=Math.hypot(dx,dy);
  if(d<0.5)return a.detT<=0;
  const want=Math.atan2(dy,dx);let da=want-a.a;da=Math.atan2(Math.sin(da),Math.cos(da));
  a.a+=clamp(da,-12*dt,12*dt);
  const step=Math.min(spdOf(a)*dt,d);
  tryMove(a,dx/d*step,dy/d*step,tx,ty);
  return a.detT<=0&&d2(a.x,a.y,tx,ty)<9;
}
function tryMove(a,mx,my,tx,ty){
  const nx=clamp(a.x+mx,3,W-3),ny=clamp(a.y+my,3,H-3);
  for(const q of G.quars){
    const r2=q.r*q.r,i0=d2(a.x,a.y,q.x,q.y)<r2,i1=d2(nx,ny,q.x,q.y)<r2;
    if(i0!==i1){
      // обход по касательной
      let rx=a.x-q.x,ry=a.y-q.y;const rl=Math.hypot(rx,ry)||1;rx/=rl;ry/=rl;
      let t1x=-ry,t1y=rx;
      if(t1x*(tx-a.x)+t1y*(ty-a.y)<0){t1x=-t1x;t1y=-t1y;}
      const off=i0?-4:4;
      a.detX=clamp(a.x+t1x*16+rx*off,3,W-3);a.detY=clamp(a.y+t1y*16+ry*off,3,H-3);a.detT=0.45;
      return false;
    }
  }
  a.x=nx;a.y=ny;return true;
}
function setWander(a,cx,cy,r){
  for(let k=0;k<6;k++){
    const an=rnd(0,6.28),rr=rnd(0,r);
    const x=clamp(cx+Math.cos(an)*rr,6,W-6),y=clamp(cy+Math.sin(an)*rr,6,H-6);
    if(qOf(x,y)===qOf(a.x,a.y)){a.tx=x;a.ty=y;return;}
  }
  a.tx=a.x;a.ty=a.y;
}
function cellXY(i){return[(i%GW+.5)*CS,((i/GW|0)+.5)*CS];}
// следование по тропе: 1 — идёт, 0 — конец тропы, -1 — тропы рядом нет
function followTrail(a,dist,dir,dt){
  if(a.cell>=0&&dist[a.cell]>=0){
    const [cx,cy]=cellXY(a.cell);
    if(d2(a.x,a.y,cx,cy)>12){steer(a,cx,cy,dt);return 1;}
  }
  const gx=clamp(a.x/CS|0,0,GW-1),gy=clamp(a.y/CS|0,0,GH-1),i=gy*GW+gx,d=dist[i];
  if(d<0){
    let best=-1,bd=1e9;
    for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
      const nx=gx+dx,ny=gy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
      const n=ny*GW+nx;if(dist[n]<0)continue;const dd=dx*dx+dy*dy;if(dd<bd){bd=dd;best=n;}
    }
    if(best<0){a.cell=-1;return -1;}
    a.cell=best;const [cx,cy]=cellXY(best);steer(a,cx,cy,dt);return 1;
  }
  let best=-1,bs=-1e9;const hx=Math.cos(a.a),hy=Math.sin(a.a);
  for(let dy=-1;dy<=1;dy++){const ny=gy+dy;if(ny<0||ny>=GH)continue;
    for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=gx+dx;if(nx<0||nx>=GW)continue;
      const n=ny*GW+nx,nd=dist[n];if(nd<0)continue;
      if(dir>0?nd<=d:nd>=d)continue;
      const inv=(dx&&dy)?0.7071:1;
      const s=(hx*dx+hy*dy)*inv*0.9+Math.random()*0.9;
      if(s>bs){bs=s;best=n;}
    }}
  if(best<0){a.cell=-1;return 0;}
  a.cell=best;const [cx,cy]=cellXY(best);steer(a,cx,cy,dt);return 1;
}

// ===================== ГНЕЗДО =====================
function exitNest(a){
  const c=G.colonies[Math.max(0,a.col)];const an=rnd(0,6.28);
  a.x=c.x+Math.cos(an)*NEST_R*0.7;a.y=c.y+Math.sin(an)*NEST_R*0.7;a.a=an;a.cell=-1;a.detT=0;
}
function placeAtExit(a,exits){
  if(!exits.length){exitNest(a);return;}
  const [x,y]=cellXY(exits[Math.random()*exits.length|0]);
  const c=G.colonies[0];a.x=x;a.y=y;a.a=Math.atan2(y-c.y,x-c.x);a.cell=-1;a.detT=0;
}
function enterNest(a){
  const c=G.colonies[a.col];
  if(a.col===0&&a.carry){
    const cap=foodCap();const add=Math.min(a.carry,Math.max(0,cap-G.food));
    G.food+=add;G.stats.collected+=a.carry;G.inc+=a.carry;
  }
  a.carry=0;a.state='nest';a.x=c.x+rnd(-5,5);a.y=c.y+rnd(-5,5);a.timer=rnd(0.6,1.6);a.cell=-1;a.target=null;a.job=null;
  if(a.col===0&&a.energy<MODES[G.workMode].thr)a.resting=true;
}
function rest(a,dt){
  const r=(5+1.6*G.nCham)*(G.workMode===0?1.4:1);
  a.energy=Math.min(100,a.energy+r*dt);
}
function drain(a,dt){
  let k=TYPES[a.type].drain;
  if(G.weather==='drought')k*=1.5;
  if(G.season===3)k*=1.4;
  a.energy=Math.max(0,a.energy-k*dt);
}
function goHome(a,dt,dist){
  const c=G.colonies[0];
  let r=dist?followTrail(a,dist,-1,dt):-1;
  if(r!==1){steer(a,c.x,c.y,dt);}
  if(d2(a.x,a.y,c.x,c.y)<(NEST_R*0.55)**2)enterNest(a);
}

// ===================== ИИ МУРАВЬЁВ =====================
function lookFood(a){
  const R=28+14*G.muts.sense;let best=null,bd=1e9;const qa=qOf(a.x,a.y);
  for(const f of G.foods){
    if(f.amt<1)continue;
    const dd=d2(a.x,a.y,f.x,f.y);const rr=R+f.r;
    if(dd<rr*rr&&dd<bd&&qOf(f.x,f.y)===qa){bd=dd;best=f;}
  }
  if(best){a.food=best;a.state='toFood';a.cell=-1;return true;}
  return false;
}
function takeFood(a,f){
  const cap=a.col===0?1+G.muts.carry:1;
  const n=Math.min(cap,Math.floor(f.amt));
  if(n<=0)return false;
  f.amt-=n;a.carry=n*f.val;a.carryCol=f.type==='berry'?'#d33b4b':f.type==='bug'?'#6b4a2a':'#58b848';
  return true;
}

function updWorker(a,dt){
  const c=G.colonies[0];
  switch(a.state){
    case 'nest':
      rest(a,dt);
      if(a.resting){if(a.energy>=95)a.resting=false;else break;}
      a.timer-=dt;if(a.timer>0)break;
      if(G.season===3&&Math.random()<0.5){a.timer=rnd(2,5);break;}
      if(G.trailOK){placeAtExit(a,G.exitsF);a.state='out';}
      else{exitNest(a);a.state='forage';a.timer=rnd(9,15);setWander(a,c.x,c.y,150);}
      break;
    case 'out':{
      drain(a,dt);
      if(a.energy<MODES[G.workMode].thr*0.5){a.state='home';break;}
      if(lookFood(a))break;
      const r=followTrail(a,G.distF,1,dt);
      if(r===0){a.state='search';a.timer=4;setWander(a,a.x,a.y,40);}
      else if(r===-1){a.state='search';a.timer=2;setWander(a,a.x,a.y,30);}
      break;}
    case 'search':
    case 'forage':
      drain(a,dt);
      if(lookFood(a))break;
      a.timer-=dt;
      if(steer(a,a.tx,a.ty,dt)){
        if(a.state==='forage')setWander(a,c.x,c.y,150);else setWander(a,a.x,a.y,35);
      }
      if(a.timer<=0)a.state='home';
      break;
    case 'toFood':{
      drain(a,dt);const f=a.food;
      if(!f||f.amt<1){a.state='search';a.timer=2.5;setWander(a,a.x,a.y,35);break;}
      steer(a,f.x,f.y,dt);
      if(d2(a.x,a.y,f.x,f.y)<(f.r*0.7+3)**2){
        if(takeFood(a,f)){a.state='home';a.cell=-1;}else{a.state='search';a.timer=2;}
      }
      break;}
    case 'home':
      drain(a,dt);goHome(a,dt,G.distF);break;
    default:a.state='home';
  }
}

function pickExplore(a){
  const c=G.colonies[0];let best=null,bs=-1e9;
  for(let k=0;k<14;k++){
    const x=rnd(30,W-30),y=rnd(30,H-30);
    if(qOf(x,y)!==qOf(a.x,a.y))continue;
    let s=(seen(x,y)?0:600)-Math.sqrt(d2(x,y,a.x,a.y))*0.5-Math.sqrt(d2(x,y,c.x,c.y))*0.15+rnd(0,150);
    if(s>bs){bs=s;best={x,y};}
  }
  if(best){a.tx=best.x;a.ty=best.y;}else setWander(a,c.x,c.y,200);
}
function updScout(a,dt){
  const c=G.colonies[0];
  switch(a.state){
    case 'nest':
      rest(a,dt);if(a.resting){if(a.energy>=95)a.resting=false;else break;}
      a.timer-=dt;if(a.timer>0)break;
      exitNest(a);a.state='explore';pickExplore(a);break;
    case 'explore':{
      drain(a,dt);
      const e=nearestHostile(a,45);
      if(e&&e.type!=='worker'){ // убегает
        a.tx=clamp(a.x+(a.x-e.x)*2,10,W-10);a.ty=clamp(a.y+(a.y-e.y)*2,10,H-10);
      }
      if(steer(a,a.tx,a.ty,dt))pickExplore(a);
      if(a.energy<25)a.state='home';
      break;}
    case 'home':drain(a,dt);goHome(a,dt,null);break;
    default:a.state='home';
  }
}

function acquire(a,r){
  const e=nearestHostile(a,r);
  if(e){if(a.state!=='fight')a.prev=a.state;a.target=e;a.state='fight';return true;}
  return false;
}
function doFight(a,dt,r){
  const t=a.target;
  if(!t||t.dead||t.state==='nest'||d2(a.x,a.y,t.x,t.y)>(r*2.2)**2){
    a.target=null;a.state=a.prev&&a.prev!=='fight'?a.prev:(a.col===0?'guard':'guard');a.cell=-1;return;
  }
  steer(a,t.x,t.y,dt);
  if(a.col===0&&G.muts.acid>=2){
    const dd=d2(a.x,a.y,t.x,t.y);
    if(dd<34*34&&dd>81){
      t.hp-=dmgOf(a)*0.6*dt;t.lastCol=0;
      a.spitT-=dt;if(a.spitT<=0){a.spitT=0.35;G.fx.push({k:'spit',x:a.x,y:a.y,x2:t.x,y2:t.y,t:0.25,m:0.25});}
      if(t.hp<=0&&!t.dead)kill(t,a);
    }
  }
}
function updSoldier(a,dt){
  const c=G.colonies[0];const ag=70+15*G.muts.sense;
  if(a.state==='nest'){
    if(G.threat&&a.energy>10){a.resting=false;exitNest(a);a.state='guard';a.timer=rnd(15,25);setWander(a,c.x,c.y,60);return;}
    rest(a,dt);if(a.resting){if(a.energy>=95)a.resting=false;else return;}
    a.timer-=dt;if(a.timer>0)return;
    if(G.warOK){placeAtExit(a,G.exitsW);a.state='march';}
    else{exitNest(a);a.state='guard';a.timer=rnd(15,25);setWander(a,c.x,c.y,80);}
    return;
  }
  if(a.state!=='fight'&&a.state!=='home'&&acquire(a,ag))return;
  if(a.state==='home'&&a.energy>5&&acquire(a,40))return;
  switch(a.state){
    case 'fight':doFight(a,dt,ag);break;
    case 'guard':
      drain(a,dt);a.timer-=dt;
      if(steer(a,a.tx,a.ty,dt))setWander(a,c.x,c.y,85);
      if(G.warOK&&!G.threat&&a.timer<10){a.state='home';break;}
      if(a.timer<=0||a.energy<25)a.state='home';
      break;
    case 'march':{
      drain(a,dt);
      if(siegeCheck(a))break;
      const r=followTrail(a,G.distW,1,dt);
      if(r===0){a.state='hold';a.timer=25;a.hx=a.x;a.hy=a.y;setWander(a,a.hx,a.hy,35);}
      else if(r===-1){a.state='guard';a.timer=10;setWander(a,c.x,c.y,80);}
      if(a.energy<20)a.state='home';
      break;}
    case 'hold':
      drain(a,dt);a.timer-=dt;
      if(siegeCheck(a))break;
      if(steer(a,a.tx,a.ty,dt))setWander(a,a.hx,a.hy,40);
      if(a.timer<=0||a.energy<20)a.state='home';
      break;
    case 'siege':{
      const e=G.colonies[a.siege];
      if(!e||!e.alive){a.state='home';break;}
      if(d2(a.x,a.y,e.x,e.y)>(NEST_R-4)**2)steer(a,e.x,e.y,dt);
      else{e.hp-=dmgOf(a)*0.3*dt;e.hitT=0.3;if(e.hp<=0)destroyColony(e);}
      break;}
    case 'home':drain(a,dt);goHome(a,dt,G.distW);break;
    default:a.state='home';
  }
}
function siegeCheck(a){
  for(const e of G.colonies){
    if(!e.alive||e.id===0)continue;
    if(d2(a.x,a.y,e.x,e.y)<100*100){a.state='siege';a.siege=e.id;return true;}
  }
  return false;
}
function updBuilder(a,dt){
  const c=G.colonies[0];
  const findJob=()=>{let best=null,bd=1e18;for(const b of G.buildings){if(b.done)continue;const dd=d2(a.x,a.y,b.x,b.y);if(dd<bd){bd=dd;best=b;}}return best;};
  switch(a.state){
    case 'nest':
      rest(a,dt);if(a.resting){if(a.energy>=95)a.resting=false;else break;}
      a.timer-=dt;if(a.timer>0)break;
      a.job=findJob();
      if(a.job){exitNest(a);a.state='build';}
      else if(c.hp<c.maxhp-1){exitNest(a);a.state='repair';}
      else a.timer=1.5;
      break;
    case 'build':{
      drain(a,dt);const b=a.job;
      if(!b||b.done||b.removed){a.job=findJob();if(!a.job)a.state='home';break;}
      let tx=b.x,ty=b.y,rr=b.r+4;
      if(b.type==='quarantine'){let vx=a.x-b.x,vy=a.y-b.y;const l=Math.hypot(vx,vy)||1;tx=b.x+vx/l*(b.r+6);ty=b.y+vy/l*(b.r+6);rr=8;}
      if(d2(a.x,a.y,tx,ty)>rr*rr)steer(a,tx,ty,dt);
      else{
        b.prog+=dt/b.work;
        if(Math.random()<dt*3)G.fx.push({k:'dust',x:a.x+rnd(-4,4),y:a.y+rnd(-4,4),t:0.5,m:0.5});
        if(b.prog>=1){b.prog=1;b.done=true;recalcBuildings();toast(`${BUILD[b.type].icon} Построено: ${BUILD[b.type].name}`,'good');}
      }
      if(a.energy<15)a.state='home';
      break;}
    case 'repair':
      drain(a,dt);
      if(d2(a.x,a.y,c.x,c.y)>(NEST_R)**2)steer(a,c.x,c.y,dt);
      else{c.hp=Math.min(c.maxhp,c.hp+2.5*dt);if(c.hp>=c.maxhp-0.5)enterNest(a);}
      if(a.energy<15)a.state='home';
      break;
    case 'home':drain(a,dt);goHome(a,dt,null);break;
    default:a.state='home';
  }
}

function pickRivalFood(c){
  const list=[];
  for(const f of G.foods){if(f.amt<1)continue;const dd=d2(f.x,f.y,c.x,c.y);if(dd<560*560)list.push([dd,f]);}
  if(!list.length)return null;
  list.sort((p,q)=>p[0]-q[0]);
  return list[Math.random()*Math.min(3,list.length)|0][1];
}
function erode(a,dt){
  const gx=a.x/CS|0,gy=a.y/CS|0,k=1-1.3*dt;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=gx+dx,ny=gy+dy;if(nx<0||ny<0||nx>=GW||ny>=GH)continue;
    const i=ny*GW+nx;G.phero[i]*=k;G.war[i]*=k;
  }
}
function updRivalAnt(a,dt){
  const c=G.colonies[a.col];
  if(!c||!c.alive){a.dead=true;return;}
  const pc=G.colonies[0];
  if(a.state!=='nest'&&a.state!=='migrate')erode(a,dt);
  if(a.type==='soldier'&&a.state!=='nest'&&a.state!=='fight'&&a.state!=='migrate'){
    if(acquire(a,a.state==='raid'?55:70))return;
  }
  switch(a.state){
    case 'nest':
      a.timer-=dt;if(a.timer>0)break;
      exitNest(a);
      if(a.type==='worker'){const f=pickRivalFood(c);if(f){a.food=f;a.state='go';}else{a.state='wander';a.timer=rnd(4,8);setWander(a,c.x,c.y,120);}}
      else{a.state='guard';a.timer=rnd(12,22);setWander(a,c.x,c.y,80);}
      break;
    case 'migrate':
      steer(a,c.x,c.y,dt);
      if(d2(a.x,a.y,c.x,c.y)<(NEST_R*0.5)**2){a.state='nest';a.timer=rnd(1,3);}
      break;
    case 'go':{
      const f=a.food;
      if(!f||f.amt<1){const nf=pickRivalFood(c);if(nf)a.food=nf;else a.state='back';break;}
      steer(a,f.x,f.y,dt);
      if(d2(a.x,a.y,f.x,f.y)<(f.r*0.7+3)**2){takeFood(a,f);a.state='back';}
      break;}
    case 'back':
      steer(a,c.x,c.y,dt);
      if(d2(a.x,a.y,c.x,c.y)<(NEST_R*0.5)**2){c.food+=a.carry*0.6;a.carry=0;a.state='nest';a.timer=rnd(0.5,2);}
      break;
    case 'wander':
      a.timer-=dt;if(steer(a,a.tx,a.ty,dt))setWander(a,c.x,c.y,120);
      if(a.timer<=0)a.state='back';
      break;
    case 'guard':
      a.timer-=dt;if(steer(a,a.tx,a.ty,dt))setWander(a,c.x,c.y,80);
      if(a.timer<=0)a.state='back';
      break;
    case 'raid':
      if(d2(a.x,a.y,pc.x,pc.y)>(NEST_R-4)**2)steer(a,pc.x,pc.y,dt);
      else{pc.hp-=dmgOf(a)*0.15*dt;G.nestHitT=0.5;}
      break;
    case 'fight':doFight(a,dt,70);break;
    default:a.state='back';
  }
}

function pickZombieTarget(a){
  let best=null,bs=-1e9;
  for(let k=0;k<12;k++){
    const an=rnd(0,6.28),r=rnd(15,70);
    const x=clamp(a.x+Math.cos(an)*r,6,W-6),y=clamp(a.y+Math.sin(an)*r,6,H-6);
    const i=cellOf(x,y);
    const s=(G.phero[i]+G.war[i])*2+Math.random()*0.6;
    if(s>bs){bs=s;best={x,y};}
  }
  a.tx=best.x;a.ty=best.y;a.timer=rnd(2,4);
}
function updZombie(a,dt){
  a.life-=dt;
  if(a.life<=0){
    a.dead=true;
    G.stalks.push({x:a.x,y:a.y,t:25,m:25});burst(a.x,a.y,2.2,1.0);
    return;
  }
  const i=cellOf(a.x,a.y);G.spores[i]=Math.min(3,G.spores[i]+0.55*dt);
  const e=nearestHostile(a,40);
  if(e)steer(a,e.x,e.y,dt);
  else{a.timer-=dt;if(steer(a,a.tx,a.ty,dt)||a.timer<=0)pickZombieTarget(a);}
  for(const c of G.colonies){
    if(c.alive&&d2(a.x,a.y,c.x,c.y)<NEST_R*NEST_R){c.hp-=0.4*dt;if(c.id===0)G.nestHitT=0.5;else c.hitT=0.3;if(c.id&&c.hp<=0)destroyColony(c,true);}
  }
}

function dmgOf(a){
  const T=TYPES[a.type];
  if(a.col===0)return T.dmg*(1+0.5*G.muts.acid);
  if(a.col>0)return T.dmg*(1+0.12*(G.year-1));
  return T.dmg;
}
const immMul=a=>a.col===0?Math.max(0.05,1-0.35*G.muts.immune):1;
function infect(a){
  if(a.inf>0||a.type==='zombie'||a.dead)return;
  a.infT=rnd(20,30);a.inf=a.infT;
  if(a.col===0)G.stats.infected++;
}
function zombify(a){
  const wasNest=a.state==='nest';
  const c=G.colonies[Math.max(0,a.col)];
  if(a.col===0){G.stats.lost++;moodAdd(-0.6);}
  a.col=-1;a.type='zombie';a.hp=TYPES.zombie.hp;a.maxhp=a.hp;a.life=40;a.state='zombie';a.carry=0;a.inf=0;a.det=false;a.target=null;a.resting=false;
  if(wasNest){const an=rnd(0,6.28);a.x=c.x+Math.cos(an)*NEST_R*0.6;a.y=c.y+Math.sin(an)*NEST_R*0.6;burst(a.x,a.y,1.5,0.5);}
  pickZombieTarget(a);
  if(c.id===0)toastOnce('zomb','🧟 Заражённый муравей превратился в зомби! Он разносит споры по тропам.','bad',20);
}
function kill(e,by){
  if(e.dead)return;
  e.dead=true;
  G.fx.push({k:'splat',x:e.x,y:e.y,t:3,m:3,c:e.type==='zombie'?'#8a5aa0':'#5a2a10'});
  if(e.type==='zombie')burst(e.x,e.y,1.3,0.5);
  if(e.col===0){G.stats.lost++;moodAdd(-0.7);}
  if(by&&by.col===0&&e.col!==0){G.stats.killed++;moodAdd(e.col>0?0.15:0.08);}
}

function updAnt(a,dt){
  // заражение
  if(a.type!=='zombie'){
    if(a.inf>0){
      a.inf-=dt;
      if(a.col===0&&!a.det&&(a.inf<a.infT*0.5||G.muts.sense>=2)){a.det=true;toastOnce('det','🟣 Обнаружен заражённый муравей (фиолетовое кольцо). Сожгите его, изолируйте или постройте 💉 Изолятор.','warn',25);}
      if(a.inf<=0){zombify(a);return;}
    }else if(a.state!=='nest'){
      const s=G.spores[cellOf(a.x,a.y)];
      if(s>0.03&&Math.random()<s*0.05*dt*immMul(a))infect(a);
    }
  }
  // контактный бой
  if(a.state!=='nest'&&a.state!=='migrate'){
    const e=nearestHostile(a,9);
    if(e){
      e.hp-=dmgOf(a)*dt;
      if(a.type==='zombie'&&e.type!=='zombie'&&Math.random()<0.3*dt*immMul(e))infect(e);
      if(e.hp<=0)kill(e,a);
    }
  }
  if(a.type==='zombie'){updZombie(a,dt);return;}
  if(a.col===0){
    if(a.det&&G.isolator&&a.state!=='isolate'){
      if(a.state==='nest')exitNest(a);
      a.state='isolate';a.carry=0;a.resting=false;
    }
    if(a.state==='isolate'){
      const b=G.isolator;
      if(!b){a.state='home';return;}
      steer(a,b.x,b.y,dt);
      if(d2(a.x,a.y,b.x,b.y)<12*12){a.dead=true;G.stats.isolated++;G.fx.push({k:'puff',x:b.x,y:b.y,t:1,m:1});}
      return;
    }
    if(a.type==='worker')updWorker(a,dt);
    else if(a.type==='scout')updScout(a,dt);
    else if(a.type==='soldier')updSoldier(a,dt);
    else updBuilder(a,dt);
  }else updRivalAnt(a,dt);
}

// ===================== ГЛОБАЛЬНЫЕ СИСТЕМЫ =====================
function onSeasonStart(){
  const s=SEASONS[G.season];
  if(G.season===0){
    toast(`🌸 Весна, год ${G.year}. Растения снова растут.`,'info');
    const alive=G.colonies.filter(c=>c.id&&c.alive).length;
    if(G.year>=2&&alive<Math.min(4,1+Math.floor(G.year/2)+1)){
      const p=findSite(520,280);
      if(p){const c=addRival(p.x,p.y,['Чёрные жнецы','Синие кочевники','Лесные бродяги','Пустынные'][G.year%4],false);toast(`🏴 На карту пришла новая колония: ${c.name}`,'warn');}
    }
  }
  if(G.season===1){
    toast('☀️ Лето. Жара может принести засуху.','info');
    if(G.year===1){const p=findSite(560,300);if(p){const c=addRival(p.x,p.y,'Синие кочевники',false);toast(`🏴 Новые соседи: ${c.name}`,'warn');}}
  }
  if(G.season===2)toast('🍂 Осень! Через 90 секунд зима — запасайте листья, постройте 📦 склад, убавьте ферму.','warn');
  if(G.season===3){toast('❄️ Зима! Листья не растут, муравьи медленнее, еды уходит больше.','bad');G.weather=null;}
}
function updSeasons(dt){
  G.seasonT+=dt;
  if(G.seasonT>=SEASON_LEN){
    G.seasonT-=SEASON_LEN;G.season=(G.season+1)%4;G.seasonsSurvived++;
    if(G.season===0)G.year++;
    onSeasonStart();
  }
}
function updWeather(dt){
  if(G.season===3){G.weather=null;return;}
  if(G.weather){G.wT-=dt;if(G.wT<=0){G.weather=null;G.wCD=rnd(20,40);}return;}
  G.wCD-=dt;if(G.wCD>0)return;
  const r=Math.random();let w=null;
  if(G.season===0&&r<0.6)w='rain';
  else if(G.season===1){if(r<0.55)w='drought';else if(r<0.75)w='rain';}
  else if(G.season===2&&r<0.7)w='rain';
  if(w){G.weather=w;G.wT=rnd(15,28);
    toast(w==='rain'?'🌧 Дождь! Феромонные следы смываются в 4 раза быстрее.':'🔥 Засуха! Растения не растут, муравьи быстрее устают.','warn');}
  else G.wCD=rnd(15,30);
}
function updEconomy(dt){
  const c=G.cnt;
  let up=0;for(const k of CASTES)up+=c[k]*TYPES[k].up;
  up*=mutMul();if(G.season===3)up*=1.35;
  G.upkeep=up;
  G.food-=up*dt;
  const pc=G.colonies[0];
  if(G.food<0){
    G.food=0;G.starve+=dt;G.starveKill+=dt;
    if(G.starveKill>4){G.starveKill=0;
      const own=G.ants.filter(a=>a.col===0&&!a.dead);
      if(own.length){const v=own[Math.random()*own.length|0];v.dead=true;G.stats.lost++;G.fx.push({k:'splat',x:v.x,y:v.y,t:3,m:3,c:'#5a2a10'});}
    }
    if(G.starve>15)pc.hp-=0.8*dt;
    toastOnce('starve','🍂 Голод! Еда кончилась — муравьи гибнут, настроение падает.','bad',20);
  }else{G.starve=Math.max(0,G.starve-dt*2);G.starveKill=0;}
  const rate=(1.0+0.8*G.nFarm)*G.farmMode/2;
  const reserve=up*15;
  const conv=Math.max(0,Math.min(rate*dt,G.food-reserve));
  G.food-=conv;G.bio+=conv;G.conv+=conv;
  G.food=Math.min(G.food,foodCap());
  if(G.food>0&&G.starve<=0)pc.hp=Math.min(pc.maxhp,pc.hp+0.3*dt);
  G.incT+=dt;
  if(G.incT>=5){G.incRate=G.inc/G.incT;G.convRate=G.conv/G.incT;G.inc=0;G.conv=0;G.incT=0;}
}
function updBrood(dt){
  if(!G.queue.length){G.broodT=0;return;}
  G.broodT+=dt;
  if(G.broodT>=3){
    G.broodT=0;const t=G.queue.shift();const pc=G.colonies[0];
    const a=mkAnt(0,t,pc.x,pc.y);a.timer=rnd(0.5,1.5);G.stats.born++;
  }
}
function updFoods(dt){
  let g=[0.28,0.2,0.08,0][G.season];
  if(G.weather==='drought')g=0;if(G.weather==='rain')g*=1.6;
  for(const f of G.foods){
    if(f.type==='plant'){if(G.season===3)f.amt=Math.max(0,f.amt-0.03*dt);else f.amt=Math.min(f.max,f.amt+g*dt);}
    else if(f.type==='berry'){if(G.season===1||G.season===2)f.amt=Math.min(f.max,f.amt+0.12*dt);}
  }
  G.foods=G.foods.filter(f=>!(f.type==='bug'&&f.amt<1));
  G.bugT=(G.bugT??60)-dt;
  if(G.bugT<=0){
    G.bugT=rnd(50,80);
    for(let k=0;k<50;k++){
      const x=rnd(50,W-50),y=rnd(50,H-50);
      if(G.colonies.some(c=>c.alive&&d2(x,y,c.x,c.y)<100*100))continue;
      if(G.foods.some(f=>d2(x,y,f.x,f.y)<50*50))continue;
      addFood('bug',x,y);break;
    }
  }
}
function updInfection(dt){
  let rate=1;if(G.weather==='rain')rate=1.6;if(G.season===3)rate=0.3;
  G.infT-=dt*rate;
  if(G.infT<=0){
    G.infT=rnd(70,120)/(1+0.1*(G.year-1));
    const own=G.ants.filter(a=>!a.dead&&a.type!=='zombie'&&a.inf<=0&&a.state!=='nest');
    const mine=own.filter(a=>a.col===0);
    const pool=(mine.length&&Math.random()<0.7)?mine:own;
    if(pool.length)infect(pool[Math.random()*pool.length|0]);
    if(Math.random()<0.35+0.1*G.year){
      for(let k=0;k<40;k++){const x=rnd(60,W-60),y=rnd(60,H-60);
        if(G.colonies.some(c=>c.alive&&d2(x,y,c.x,c.y)<160*160))continue;
        G.stalks.push({x,y,t:30,m:30});burst(x,y,2.5,1);break;}
    }
  }
  // заражение внутри гнёзд
  G.nestInfT+=dt;
  if(G.nestInfT>=0.5){
    const ndt=G.nestInfT;G.nestInfT=0;
    const by={};
    for(const a of G.ants){if(a.dead||a.state!=='nest'||a.type==='zombie')continue;(by[a.col]||(by[a.col]={i:0,h:[]}));if(a.inf>0)by[a.col].i++;else by[a.col].h.push(a);}
    for(const k in by){const o=by[k];if(!o.i||!o.h.length)continue;
      const v=o.h[Math.random()*o.h.length|0];
      if(Math.random()<0.02*o.i*ndt*immMul(v))infect(v);}
  }
  // грибные ножки
  for(const s of G.stalks){
    s.t-=dt;
    const i=cellOf(s.x,s.y);
    if(Math.random()<dt*2)burst(s.x,s.y,2,0.35);
    G.spores[i]=Math.min(3,G.spores[i]+0.3*dt);
  }
  G.stalks=G.stalks.filter(s=>s.t>0);
}
function updRivals(dt){
  const info={};
  for(const a of G.ants){if(a.dead||a.col<=0)continue;const o=info[a.col]||(info[a.col]={pop:0,s:0,raid:0,list:[]});o.pop++;if(a.type==='soldier'){o.s++;o.list.push(a);}if(a.raider)o.raid++;}
  for(const c of G.colonies){
    if(!c.id||!c.alive)continue;
    const o=info[c.id]||{pop:0,s:0,raid:0,list:[]};
    c.pop=o.pop;c.sold=o.s;
    c.hitT=Math.max(0,(c.hitT||0)-dt);
    c.food-=o.pop*0.015*dt*(G.season===3?1.3:1);
    if(c.food<0){c.food=0;c.starveT+=dt;if(c.starveT>3){c.starveT=0;const l=G.ants.filter(a=>a.col===c.id&&!a.dead);if(l.length)l[Math.random()*l.length|0].dead=true;}}
    c.hp=Math.min(c.maxhp,c.hp+0.4*dt);
    c.spawnT-=dt;
    const cap=(c.rebel?10:14)+6*G.year;
    if(c.spawnT<=0){
      c.spawnT=Math.max(3,7-G.year*0.6);
      if(c.food>=10&&o.pop<cap){
        const want=0.22+0.04*G.year;
        const t=(o.s<o.pop*want)?'soldier':'worker';
        const a=mkAnt(c.id,t,c.x,c.y);a.timer=rnd(0.5,2);c.food-=10;
      }
    }
    c.raidT-=dt;
    if(c.raidT<=0){
      const avail=o.list.filter(a=>!a.raider&&a.state!=='migrate');
      if(avail.length>=5){
        const n=Math.ceil(avail.length*0.55);
        for(let i=0;i<n;i++){const a=avail[i];if(a.state==='nest')exitNest(a);a.state='raid';a.raider=true;a.target=null;}
        c.raiding=true;c.raidN=n;G.stats.raids++;
        toast(`⚔️ ${c.name} идут в набег на ваше гнездо! (${n} солд.)`,'bad');
        c.raidT=rnd(140,200)/(1+0.15*(G.year-1));
      }else c.raidT=20;
    }
    if(c.raiding&&o.raid===0){
      c.raiding=false;
      if(G.colonies[0].hp>0){toast(`🛡 Набег колонии «${c.name}» отбит!`,'good');moodAdd(6);}
    }
  }
}
// гнездо обороняется: муравьи внутри кусают ближайшего врага у входа
function nestDefense(dt){
  for(const c of G.colonies){
    if(!c.alive)continue;
    const k=(G.inNest&&G.inNest[c.id])||0;
    const e=nearestHostile({x:c.x,y:c.y,col:c.id},NEST_R+8);
    if(!e)continue;
    let dps=1.5+0.6*Math.min(k,15);
    if(c.id===0)dps*=1+0.5*G.muts.acid;
    e.hp-=dps*dt;
    if(e.hp<=0)kill(e,{col:c.id});
  }
}
function destroyColony(c,byZombies){
  if(!c.alive)return;
  c.alive=false;
  for(const a of G.ants)if(a.col===c.id){a.dead=true;G.fx.push({k:'splat',x:a.x,y:a.y,t:3,m:3,c:'#5a2a10'});}
  G.fx.push({k:'boom',x:c.x,y:c.y,t:2,m:2});
  if(!byZombies){
    const loot=Math.round(c.food*0.6);G.food=Math.min(foodCap(),G.food+loot);
    G.stats.nests++;moodAdd(20);
    toast(`🏆 Гнездо «${c.name}» уничтожено! Добыча: ${loot}🍃`,'good');
  }else toast(`🧟 Гнездо «${c.name}» погибло от грибка.`,'warn');
}
function moodAdd(v){G.mood=clamp(G.mood+v,0,100);}
function updMood(dt){
  let d=0;const up=G.upkeep||0.0001;const fs=G.food/up;
  d+=(60-G.mood)*0.012;
  if(G.starve>0)d-=2.5;else if(fs>60)d+=0.22;else if(fs<15)d-=0.3;
  let es=0,en=0;for(const a of G.ants)if(a.col===0&&!a.dead){es+=a.energy;en++;}
  const avg=en?es/en:100;G.avgE=avg;
  if(avg<30)d-=0.7;else if(avg<50)d-=0.2;else if(avg>75)d+=0.1;
  if(G.workMode===2)d-=0.35;if(G.workMode===0)d+=0.25;
  const cap=popCap();if(G.pop>cap)d-=(G.pop-cap)/cap*4;
  d+=0.06*G.nCham;
  d-=0.04*Math.min(25,G.zombies);
  if(G.season===3)d-=0.1;
  moodAdd(d*dt);
  if(G.mood<25)toastOnce('moodlow','😠 Колония недовольна! Если настроение упадёт ниже 20 — начнётся бунт.','warn',30);
  if(G.mood<20){G.rebel+=dt/18;}else G.rebel=Math.max(0,G.rebel-dt/30);
  if(G.rebel>=1)doRebellion();
}
function doRebellion(){
  G.rebel=0;
  const own=G.ants.filter(a=>a.col===0&&!a.dead&&a.state!=='isolate');
  if(own.length<6){G.mood=35;return;}
  const n=Math.max(3,Math.round(own.length*0.25));
  for(let i=own.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[own[i],own[j]]=[own[j],own[i]];}
  const p=findSite(300,230);
  const c=addRival(p.x,p.y,'Мятежники'+(G.stats.rebellions?' '+(G.stats.rebellions+1):''),true);
  const stolen=Math.round(G.food*0.25);G.food-=stolen;c.food=stolen+15;
  for(let i=0;i<n;i++){
    const a=own[i];if(a.state==='nest')exitNest(a);
    a.col=c.id;a.type=a.type==='soldier'?'soldier':'worker';a.state='migrate';a.carry=0;a.target=null;a.resting=false;a.det=false;a.cell=-1;
  }
  G.stats.rebellions++;G.mood=45;
  toast(`💢 БУНТ! ${n} муравьёв ушли и основывают колонию «${c.name}», украв ${stolen}🍃`,'bad');
}
function updFog(dt){
  G.fogT-=dt;if(G.fogT>0)return;G.fogT=0.3;
  for(const a of G.ants){
    if(a.col!==0||a.dead||a.state==='nest')continue;
    const r=a.type==='scout'?90+28*G.muts.sense:40+10*G.muts.sense;
    revealCircle(a.x,a.y,r);
  }
}
function countAll(){
  const c={worker:0,scout:0,soldier:0,builder:0},nc={};let z=0,inf=0,pop=0;
  for(const a of G.ants){if(a.dead)continue;
    if(a.type==='zombie'){z++;continue;}
    if(a.state==='nest')nc[a.col]=(nc[a.col]||0)+1;
    if(a.col===0){c[a.type]++;pop++;if(a.det)inf++;}}
  G.cnt=c;G.inNest=nc;G.pop=pop;G.zombies=z;G.infected=inf;
  G.stats.maxPop=Math.max(G.stats.maxPop,pop);
}
function checkOver(){
  const pc=G.colonies[0];
  if(pc.hp<=0){gameOver('👑 Матка погибла');return;}
  if(G.pop===0&&!G.queue.length&&G.bio<TYPES.worker.cost){gameOver('🐜 Колония вымерла');return;}
  const rivals=G.colonies.filter(c=>c.id&&c.alive).length;
  if(rivals===0&&G.stats.nests>0&&!G.dominantShown){
    G.dominantShown=true;G.stats.dominant=true;
    toast('👑 Вы — доминирующая колония на карте! Но новые колонии ещё придут…','good');
  }
  if(rivals>0)G.dominantShown=false;
}

function update(dt){
  G.t+=dt;
  countAll();
  updSeasons(dt);updWeather(dt);updEconomy(dt);updBrood(dt);updFoods(dt);
  G.fT+=dt;if(G.fT>=0.25){updFields(G.fT);G.fT=0;}
  G.bfsT-=dt;if(G.bfsT<=0){runBFS();G.bfsT=0.4;}
  buildHash();
  const ants=G.ants;
  for(let i=0;i<ants.length;i++){const a=ants[i];if(!a.dead)updAnt(a,dt);}
  // урон от кислоты/плевков может убить — убираем мёртвых
  let anyDead=false;for(const a of ants)if(a.dead){anyDead=true;break;}
  nestDefense(dt);
  for(const a of ants)if(a.dead){anyDead=true;break;}
  if(anyDead)G.ants=ants.filter(a=>!a.dead);
  updInfection(dt);updRivals(dt);updMood(dt);updFog(dt);
  G.nestHitT=Math.max(0,G.nestHitT-dt);
  for(const f of G.fx)f.t-=dt;
  G.fx=G.fx.filter(f=>f.t>0);
  checkOver();
}

function enqueue(t){
  const T=TYPES[t];
  if(G.bio<T.cost){toast(`Нужно ${T.cost}🧬 биомассы`,'info');return;}
  G.bio-=T.cost;G.queue.push(t);updateUI(true);
}
function canPlace(type,x,y){
  const B=BUILD[type],pc=G.colonies[0];
  const dn=Math.sqrt(d2(x,y,pc.x,pc.y));
  if(type==='quarantine'){
    for(const c of G.colonies)if(c.alive&&Math.sqrt(d2(x,y,c.x,c.y))<NEST_R+B.r+12)return 'Слишком близко к гнезду';
    for(const q of G.buildings)if(q.type==='quarantine'&&Math.sqrt(d2(x,y,q.x,q.y))<q.r+B.r)return 'Пересекается с другим карантином';
    return null;
  }
  if(dn>125)return 'Камеры строятся рядом с гнездом';
  if(dn<NEST_R+B.r-2)return 'Слишком близко к центру гнезда';
  for(const b of G.buildings){if(b.type==='quarantine'){if(Math.sqrt(d2(x,y,b.x,b.y))<b.r+B.r)return 'Мешает карантин';continue;}
    if(Math.sqrt(d2(x,y,b.x,b.y))<b.r+B.r+4)return 'Мешает другая постройка';}
  return null;
}
function place(type,x,y){
  const B=BUILD[type];
  const err=canPlace(type,x,y);if(err){toast(err,'info');return;}
  if(G.food<B.food||G.bio<B.bio){toast(`Нужно ${B.food}🍃${B.bio?' и '+B.bio+'🧬':''}`,'info');return;}
  if(!G.cnt.builder&&!G.queue.includes('builder'))toast('Нет строителей! Вырастите 🔨 строителя.','warn');
  G.food-=B.food;G.bio-=B.bio;
  G.buildings.push({type,x,y,r:B.r,prog:0,done:false,work:B.work});
  updateUI(true);
}
function eraseClick(x,y){
  for(let i=G.buildings.length-1;i>=0;i--){
    const b=G.buildings[i];
    if(d2(x,y,b.x,b.y)<16*16&&(!b.done||b.type==='quarantine')){
      if(!b.done){G.food+=BUILD[b.type].food;G.bio+=BUILD[b.type].bio;toast('Постройка отменена, ресурсы возвращены','info');}
      else toast('🚧 Карантин снят','info');
      b.removed=true;G.buildings.splice(i,1);recalcBuildings();return true;
    }
  }
  return false;
}
function burnAt(x,y){
  if(G.bio<10||G.food<5){toast('Для огня нужно 10🧬 и 5🍃','info');return;}
  G.bio-=10;G.food-=5;
  const R=40;let own=0,other=0;
  for(const a of G.ants){
    if(a.dead||a.state==='nest')continue;
    if(d2(a.x,a.y,x,y)<R*R){a.dead=true;if(a.col===0){own++;G.stats.burned++;}else other++;}
  }
  const gx=x/CS,gy=y/CS,r=R/CS;
  for(let cy=Math.floor(gy-r);cy<=Math.ceil(gy+r);cy++)for(let cx=Math.floor(gx-r);cx<=Math.ceil(gx+r);cx++){
    if(cx<0||cy<0||cx>=GW||cy>=GH)continue;
    if((cx+.5-gx)**2+(cy+.5-gy)**2<=r*r){const i=cy*GW+cx;G.spores[i]=0;G.phero[i]=0;G.war[i]=0;}
  }
  G.stalks=G.stalks.filter(s=>d2(s.x,s.y,x,y)>=R*R);
  for(const f of G.foods)if(d2(f.x,f.y,x,y)<R*R)f.amt*=0.4;
  if(own)moodAdd(-0.4*own);
  G.fx.push({k:'fire',x,y,t:1.6,m:1.6,r:R});
  G.bfsT=0;
  if(own||other)toast(`🔥 Сожжено: своих ${own}, чужих/зомби ${other}`,own?'warn':'info');
}

const cv=$('cv'),ctx=cv.getContext('2d');
const cam={s:1,ox:0,oy:0,fit:1,cw:0,ch:0,dpr:1};
function resize(){
  const r=$('wrap').getBoundingClientRect();
  cam.dpr=Math.min(2,window.devicePixelRatio||1);
  cam.cw=r.width;cam.ch=r.height;
  cv.width=Math.round(r.width*cam.dpr);cv.height=Math.round(r.height*cam.dpr);
  const of=cam.fit;cam.fit=Math.min(cam.cw/W,cam.ch/H);
  if(of===1&&cam.s===1)fitCam(true);else{cam.s=Math.max(cam.s,cam.fit);clampCam();}
}
function fitCam(initial){
  cam.fit=Math.min(cam.cw/W,cam.ch/H)||1;
  if(initial&&G){
    const s=Math.max(cam.fit,cam.cw<700?Math.min(cam.cw/520,cam.ch/H):Math.min(cam.cw/1050,cam.ch/700,cam.fit*2.2));
    cam.s=s;const pc=G.colonies[0];
    cam.ox=cam.cw/2-pc.x*s;cam.oy=cam.ch/2-pc.y*s;
  }else{cam.s=cam.fit;}
  clampCam();
}
function clampCam(){
  const s=cam.s,ww=W*s,wh=H*s;
  if(ww<=cam.cw)cam.ox=(cam.cw-ww)/2;else cam.ox=clamp(cam.ox,cam.cw-ww,0);
  if(wh<=cam.ch)cam.oy=(cam.ch-wh)/2;else cam.oy=clamp(cam.oy,cam.ch-wh,0);
}
function zoomAt(sx,sy,f){
  const ns=clamp(cam.s*f,cam.fit,cam.fit*5);
  const wx=(sx-cam.ox)/cam.s,wy=(sy-cam.oy)/cam.s;
  cam.s=ns;cam.ox=sx-wx*ns;cam.oy=sy-wy*ns;clampCam();
}
const toWorld=(sx,sy)=>({x:(sx-cam.ox)/cam.s,y:(sy-cam.oy)/cam.s});
let tool='trail',drawing=false,lastW=null,panning=null,pinch=null,hover=null;
const ptrs=new Map();
function sp(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over)return;
  cv.setPointerCapture(e.pointerId);
  const p=sp(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){
    drawing=false;panning=null;
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};return;
  }
  if(ptrs.size>2)return;
  if(e.button===1||e.button===2||tool==='pan'){panning={x:p.x,y:p.y};return;}
  const w=toWorld(p.x,p.y);
  if(tool==='trail'||tool==='war'||tool==='erase'){
    if(tool==='erase'&&eraseClick(w.x,w.y))return;
    drawing=true;lastW=w;paintLine(w,w,tool);
  }else if(tool==='burn')burnAt(w.x,w.y);
  else if(BUILD[tool])place(tool,w.x,w.y);
});
cv.addEventListener('pointermove',e=>{
  const p=sp(e);hover=toWorld(p.x,p.y);
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.ox+=mx-pinch.mx;cam.oy+=my-pinch.my;
    if(pinch.d>10)zoomAt(mx,my,d/pinch.d);
    clampCam();pinch={d,mx,my};return;
  }
  if(panning){cam.ox+=p.x-panning.x;cam.oy+=p.y-panning.y;panning={x:p.x,y:p.y};clampCam();return;}
  if(drawing&&G&&!G.over){const w=toWorld(p.x,p.y);paintLine(lastW,w,tool);lastW=w;}
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){drawing=false;panning=null;}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=sp(e);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15);},{passive:false});

    const k=s.t/s.m;
    ctx.fillStyle=`rgba(190,90,230,${0.15+0.15*Math.sin(G.t*4+s.x)})`;circ(s.x,s.y,14);
    ctx.strokeStyle='#8a4aa8';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x+3,s.y-9);ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-4,s.y-7);ctx.stroke();
    ctx.fillStyle='#c870ec';circ(s.x+3,s.y-9,2.5*k+1);circ(s.x-4,s.y-7,2*k+1);
  }
  const legs=cam.s>0.8;
  for(const a of G.ants){
    if(a.state==='nest')continue;
    if(a.col!==0&&!seen(a.x,a.y))continue;
    drawAnt(a,legs);
  }
  for(const f of G.fx){
    const k=f.t/f.m;
    if(f.k==='splat'){ctx.fillStyle=f.c;ctx.globalAlpha=0.5*k;circ(f.x,f.y,3);ctx.globalAlpha=1;}
    else if(f.k==='spit'){ctx.strokeStyle=`rgba(180,230,60,${k})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.lineTo(f.x2,f.y2);ctx.stroke();}
    else if(f.k==='dust'){ctx.fillStyle=`rgba(230,200,150,${k*0.6})`;circ(f.x,f.y,2+(1-k)*3);}
    else if(f.k==='puff'){ctx.strokeStyle=`rgba(200,120,240,${k})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,8+(1-k)*14,0,6.2832);ctx.stroke();}
    else if(f.k==='boom'){ctx.strokeStyle=`rgba(255,200,80,${k})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,NEST_R+(1-k)*40,0,6.2832);ctx.stroke();}
    else if(f.k==='fire'){
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
      g.addColorStop(0,`rgba(255,240,150,${k})`);g.addColorStop(0.5,`rgba(255,120,20,${k*0.8})`);g.addColorStop(1,'rgba(120,20,0,0)');
      ctx.fillStyle=g;circ(f.x,f.y,f.r*(1.1-0.2*k));
      for(let i=0;i<8;i++){const an=i*0.785+G.t*3,r=f.r*0.6*(1-k*0.5);ctx.fillStyle=`rgba(255,${150+i*10},40,${k})`;circ(f.x+Math.cos(an)*r,f.y+Math.sin(an)*r,4*k+1);}
    }
  }
  if(G.fogDirty)renderFog();
  ctx.drawImage(fogB,0,0,W,H);
  // превью инструмента
  if(hover&&!G.over){
    ctx.lineWidth=1.5/cam.s*1.2;
    if(tool==='trail'||tool==='war'||tool==='erase'){
      ctx.strokeStyle=tool==='trail'?'rgba(80,230,100,0.8)':tool==='war'?'rgba(240,70,60,0.8)':'rgba(255,255,255,0.7)';
      ctx.beginPath();ctx.arc(hover.x,hover.y,tool==='erase'?22:10,0,6.2832);ctx.stroke();
    }else if(tool==='burn'){ctx.strokeStyle='rgba(255,130,30,0.9)';ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(hover.x,hover.y,40,0,6.2832);ctx.stroke();ctx.setLineDash([]);}
    else if(BUILD[tool]){
      const ok=!canPlace(tool,hover.x,hover.y);
      ctx.strokeStyle=ok?'rgba(120,255,120,0.9)':'rgba(255,80,80,0.9)';ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.arc(hover.x,hover.y,BUILD[tool].r,0,6.2832);ctx.stroke();ctx.setLineDash([]);
      if(tool!=='quarantine'){const pc=G.colonies[0];ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.beginPath();ctx.arc(pc.x,pc.y,125,0,6.2832);ctx.stroke();}
    }
  }
  // погода
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cw=cam.cw,ch=cam.ch;
  if(G.season===3){
    ctx.fillStyle='rgba(225,235,255,0.22)';ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    for(const f of snow){if(!G.paused){f.y+=f.v*rdt;f.p+=rdt;}if(f.y>1)f.y-=1;circ((f.x+Math.sin(f.p)*0.01)*cw,f.y*ch,1.8);}
  }else if(G.season===2){ctx.fillStyle='rgba(200,110,30,0.06)';ctx.fillRect(0,0,cw,ch);}
  if(G.weather==='rain'){
    ctx.fillStyle='rgba(40,60,110,0.16)';ctx.fillRect(0,0,cw,ch);
    ctx.strokeStyle='rgba(190,210,255,0.45)';ctx.lineWidth=1;ctx.beginPath();
    for(const r of rainDrops){if(!G.paused){r.y+=r.v*rdt*1.5;}if(r.y>1){r.y-=1;r.x=Math.random();}const x=r.x*cw,y=r.y*ch;ctx.moveTo(x,y);ctx.lineTo(x-3,y+12);}
    ctx.stroke();
  }else if(G.weather==='drought'){ctx.fillStyle='rgba(255,190,60,0.12)';ctx.fillRect(0,0,cw,ch);}
  if(G.paused&&!ovOpen&&!G.over){
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle='#fff';ctx.font='bold 28px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('⏸ ПАУЗА',cw/2,ch/2);
  }
}

// ===================== ЦИКЛ =====================
let lastT=performance.now();
function frame(now){
  const rdt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(G&&G.started&&!G.over&&!G.paused&&!ovOpen){
    for(let i=0;i<G.speed;i++){update(rdt);if(G.over)break;}
  }
  render(rdt);
  updateUI(false);
  requestAnimationFrame(frame);
}
buildButtons();
resize();
newGame();
fitCam(true);
showStart();
requestAnimationFrame(frame);
window.__colony={get G(){return G;},update,paintLine,place,burnAt,enqueue};
</script>
</body>
