<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Карантин</title>
<style>
/* ===== Оформление: ночная карта оперативного штаба. Графит, моноширинные подписи,
   розовый — заражение, синий — полиция, жёлтый — санитары, бирюзовый — чекпоинты ===== */
:root{--bg:#111316;--panel:#17191d;--panel2:#202328;--line:#2d3137;--fg:#e6e8eb;--dim:#868e98;--acc:#e8b84a;--red:#ff7a7a;--blue:#5ea8ff;--ok:#5fd38a;--teal:#2bb3a0;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);flex:none;font-family:var(--mono);font-size:12px}
.lvl{font-weight:700;color:#111;background:var(--acc);letter-spacing:2px;white-space:nowrap;text-transform:uppercase;font-size:11px;padding:3px 8px;border-radius:3px}
#chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;padding:3px 8px;border-radius:3px;background:#0b0c0e;border:1px solid #23262b}
.chip i{font-style:normal;color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip.r b{color:var(--red)}.chip.d b{color:#9aa1a9}.chip.g b{color:#fff}.chip.y b{color:var(--acc)}.chip.bl b{color:var(--blue)}.chip.t b{color:var(--teal)}.chip.p b{color:#d58cff}
.meter{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--dim)}
.bar{position:relative;width:96px;height:6px;background:#000;border:1px solid #2b2f35;overflow:hidden;display:inline-block}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff9a9a,#ff4d5a);transition:width .25s}
.bar s{position:absolute;top:0;bottom:0;width:2px;background:#fff}
.sp{flex:1}
.ctrl{display:flex;gap:3px}
.tb{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 8px;cursor:pointer;min-width:32px;font-family:var(--mono)}
.tb.on{border-color:var(--acc);color:var(--acc)}
.tb:focus-visible,.tool:focus-visible,.big:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c0d0f}
canvas{display:block;width:100%;height:100%;touch-action:none}
#bottom{background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;touch-action:pan-x;flex:none;scrollbar-width:thin}
#tools{display:flex;gap:4px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:max-content}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;padding:5px 6px 4px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;line-height:1.15;position:relative}
.tool .i{font-size:18px}
.tool small{font-size:10px;white-space:nowrap;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.tool em{font-style:normal;font-size:10px;color:var(--acc);white-space:nowrap;font-family:var(--mono)}
.tool.on{border-color:var(--acc);background:#2b2616;box-shadow:inset 0 -2px 0 var(--acc)}
.tool.na{opacity:.42}
.tool kbd{position:absolute;top:2px;left:4px;font-size:9px;color:#5c636c;font-family:var(--mono)}
#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:min(560px,92%)}
.toast{background:#0b0c0ef0;padding:6px 12px;border-radius:3px;font-size:12px;border:1px solid #2a2e34;border-left:3px solid var(--dim);transition:opacity .5s;text-align:center;font-family:var(--mono)}
.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--acc)}.toast.info{border-left-color:var(--blue)}.toast.mut{border-left-color:#d58cff}
#hint{position:absolute;left:10px;bottom:8px;font-size:11px;background:#0b0c0ee0;border:1px solid #23262b;padding:4px 9px;border-radius:3px;pointer-events:none;max-width:calc(100% - 20px);font-family:var(--mono)}
#legend{position:absolute;right:10px;bottom:8px;font:10px/1.6 var(--mono);background:#0b0c0ee0;border:1px solid #23262b;padding:5px 9px;border-radius:3px;pointer-events:none;color:var(--dim)}
#legend span{display:inline-block;width:7px;height:7px;margin-right:5px;vertical-align:0}
#info{position:absolute;right:10px;top:10px;width:280px;background:#15171bf2;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:12px;box-shadow:0 6px 24px #000a}
#info h3{font:700 13px var(--mono);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
#info h3 button{background:none;border:0;cursor:pointer;font-size:15px;color:var(--dim)}
#info .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dashed #23262b}
#info .row b{font-variant-numeric:tabular-nums;font-family:var(--mono)}
#info .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
#info .acts button{flex:1 1 45%;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px;cursor:pointer;font-size:11px}
#info .acts button.on{border-color:var(--acc);color:var(--acc)}
#info .acts button.danger{border-color:#6e2a30;color:#ff9b9b}
#info .note{font-size:11px;color:var(--dim);margin-top:7px}
@media (max-width:640px){
  #info{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:55%;overflow:auto}
  #top{gap:3px 6px;font-size:11px}.chip{padding:2px 5px;gap:3px}.chip i{font-size:8px;letter-spacing:0}.bar{width:56px}
  .toast{font-size:10px;padding:4px 8px}.toast:nth-last-child(n+3){display:none}
  .tool{min-width:58px}.tool .i{font-size:16px}.tool kbd{display:none}
  #legend{display:none}#hint{font-size:10px}
}
#ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#ov.show{display:flex}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 24px;width:min(680px,100%);max-height:94%;overflow:auto;touch-action:pan-y;box-shadow:0 10px 50px #000}
.panel h1{font:800 40px/1 var(--mono);letter-spacing:8px;color:var(--fg);margin-bottom:6px}
.panel h1 em{font-style:normal;color:var(--red)}
.panel h2{font:700 20px var(--mono);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase;text-wrap:balance}
.panel .sub{color:var(--acc);margin-bottom:14px;font:11px var(--mono);letter-spacing:3px;text-transform:uppercase}
.panel p,.panel li{font-size:14px;line-height:1.55;margin-bottom:6px;max-width:68ch}
.panel ul{padding-left:20px;margin-bottom:10px}
.big{background:var(--acc);border:1px solid var(--acc);color:#111;border-radius:3px;padding:9px 16px;font:700 13px var(--mono);letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin:8px 6px 0 0}
.big.alt{background:var(--panel2);border-color:var(--line);color:var(--fg)}
.stats{display:grid;grid-template-columns:1fr auto;gap:3px 24px;margin:12px 0;font-size:13px}
.stats div:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.lvlcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:12px 0}
.lvlcards button{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px;text-align:left;cursor:pointer}
.lvlcards button b{display:block;font:700 13px var(--mono);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.lvlcards button:disabled{opacity:.35;cursor:default}
.tag{display:inline-block;font:10px var(--mono);padding:1px 6px;border-radius:2px;background:#0006;color:var(--dim);margin-right:4px}
.keys{font:11px/1.7 var(--mono);color:var(--dim);margin-top:6px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="top">
  <span class="lvl" id="lvl">Карантин</span>
  <div id="chips"></div>
  <span class="meter" title="Порог потери уровня: при его достижении вирус вырывается на следующий масштаб"><span id="meterT">Потери 0%</span><span class="bar"><i id="meterB" style="width:0"></i><s id="meterS" style="left:50%"></s></span></span>
  <span class="chip y" title="Бюджет экстренной службы"><b id="money">0</b></span>
  <span class="chip" title="Игровое время"><b id="clock">—</b></span>
  <span class="sp"></span>
  <div class="ctrl">
    <button class="tb" id="bPause" title="Пауза (Пробел)">⏸</button>
    <button class="tb spd on" data-s="1">1×</button>
    <button class="tb spd" data-s="2">2×</button>
    <button class="tb spd" data-s="4">4×</button>
    <button class="tb" id="bRestart" title="Перезапустить уровень">↻</button>
    <button class="tb" id="bSound" title="Звук">🔊</button>
    <button class="tb" id="bMenu" title="Меню (Esc)">☰</button>
  </div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="toasts"></div>
  <div id="hint"></div>
  <div id="legend"></div>
  <div id="info" hidden></div>
</div>
<div id="bottom"><div id="tools"></div></div>
<div id="ov"><div class="panel" id="ovp"></div></div>

<script>
'use strict';
/* =====================================================================
   КАРАНТИН — экстренная служба против зомби-вируса на трёх масштабах.
   Уровень 1 — город: граф улиц, метро, районы, ~2000 жителей-агентов.
   Уровень 2 — регион: города-узлы, модель S-E-I-L-D.
   Уровень 3 — земной шар: страны, авиа, морские пути и границы.
   Вирус мутирует, и мутации переходят с уровня на уровень.
   ===================================================================== */

// ---------- Общие утилиты ----------
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const MONO='ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace';
// детерминированный генератор: одинаковый seed — одинаковая карта (нужно для сохранений)
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fmtInt(n){n=Math.round(n);return n.toLocaleString('ru-RU');}
function fmtPeople(n){
  if(n>=1e9)return (n/1e9).toFixed(2)+' млрд';
  if(n>=1e6)return (n/1e6).toFixed(n>=1e8?0:1)+' млн';
  if(n>=1e4)return Math.round(n/1e3)+' тыс';
  return fmtInt(n);
}
const pct=v=>(v*100).toFixed(v<0.1?1:0)+'%';
function segX(ax,ay,bx,by,cx,cy,dx,dy){ // пересечение отрезков AB и CD → [t,u] или null
  const rx=bx-ax,ry=by-ay,sx=dx-cx,sy=dy-cy,den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return null;
  const t=((cx-ax)*sy-(cy-ay)*sx)/den,u=((cx-ax)*ry-(cy-ay)*rx)/den;
  return t>=0&&t<=1&&u>=0&&u<=1?[t,u]:null;
}
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);return[Math.hypot(px-ax-dx*t,py-ay-dy*t),t];}
function spacedText(ctx,text,x,y,sp){ // текст с разрядкой; использует letterSpacing, если браузер умеет
  if('letterSpacing' in ctx){ctx.letterSpacing=sp+'px';ctx.strokeText(text,x,y);ctx.fillText(text,x,y);ctx.letterSpacing='0px';}
  else{ctx.strokeText(text,x,y);ctx.fillText(text,x,y);}
}

// ---------- Звук: всё синтезируется через Web Audio API ----------
const Snd={
  ctx:null,on:true,last:{},noise:null,master:null,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      const len=this.ctx.sampleRate*2,b=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      this.noise=b;this.master=this.ctx.createGain();this.master.gain.value=0.45;this.master.connect(this.ctx.destination);
    }catch(e){this.ctx=null;}
  },
  gap:{gun:0.06,sniper:0.25,heli:2,wall:0.15,alarm:1.5,boom:0.3,nuke:2,click:0.03,bite:0.12,good:0.4,bad:0.3,iso:0.2,mut:1,scan:0.3},
  play(name){
    if(!this.on||!this.ctx||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime;
    if(this.last[name]!==undefined&&t-this.last[name]<(this.gap[name]||0.05))return;
    this.last[name]=t;
    try{this['s_'+name]&&this['s_'+name](t);}catch(e){}
  },
  nz(t,dur,freq,type,gain){
    const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=this.noise;f.type=type;f.frequency.value=freq;
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.master);s.start(t,Math.random());s.stop(t+dur+0.05);
  },
  tone(t,dur,f0,f1,type,gain){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05);
  },
  s_gun(t){this.nz(t,0.06,2200,'highpass',0.16);},
  s_sniper(t){this.nz(t,0.3,1200,'lowpass',0.45);this.tone(t,0.18,160,45,'sine',0.35);},
  s_heli(t){for(let k=0;k<14;k++)this.nz(t+k*0.085,0.06,260,'lowpass',0.3*(1-k/16));},
  s_wall(t){this.tone(t,0.12,150,60,'square',0.12);},
  s_alarm(t){this.tone(t,0.16,880,860,'square',0.06);this.tone(t+0.22,0.16,660,650,'square',0.06);this.tone(t+0.44,0.16,880,860,'square',0.06);},
  s_boom(t){this.nz(t,1.3,380,'lowpass',0.9);this.tone(t,0.9,90,28,'sine',0.6);},
  s_nuke(t){this.nz(t,3.5,220,'lowpass',1.1);this.tone(t,3,70,18,'sine',0.9);},
  s_click(t){this.tone(t,0.04,700,500,'sine',0.06);},
  s_bite(t){this.tone(t,0.09,220,110,'sawtooth',0.05);},
  s_good(t){this.tone(t,0.12,523,523,'triangle',0.12);this.tone(t+0.13,0.2,784,784,'triangle',0.12);},
  s_bad(t){this.tone(t,0.25,300,140,'sawtooth',0.08);},
  s_iso(t){this.tone(t,0.08,1000,1200,'sine',0.06);},
  s_mut(t){this.tone(t,0.5,90,180,'sawtooth',0.06);this.tone(t+0.1,0.5,95,190,'sawtooth',0.05);},
  s_scan(t){this.tone(t,0.25,1500,600,'sine',0.06);}
};

// ---------- Всплывающие сообщения ----------
function toast(msg,type='info'){
  const box=$('toasts'),d=document.createElement('div');
  d.className='toast '+type;d.textContent=msg;box.appendChild(d);
  while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),600);},5500);
}
function spend(S,c){
  if(S.money<c){toast(`Не хватает бюджета: нужно $${fmtInt(c)}`,'warn');Snd.play('bad');return false;}
  S.money-=c;Snd.play('click');return true;
}

// ---------- Штамм вируса: мутации копятся и переходят между уровнями ----------
const MUTS=[
  {id:'fast',name:'Быстрая инкубация',d:'инкубация на 30% короче'},
  {id:'silent',name:'Бессимптомность',d:'симптомы почти незаметны: тесты и чекпоинты ошибаются чаще'},
  {id:'runners',name:'Бегуны',d:'активные зомби на 25% быстрее'},
  {id:'tough',name:'Живучесть',d:'поздние зомби выдерживают на 2 попадания больше'},
  {id:'air',name:'Воздушный путь',d:'заражение при контакте в 1.6 раза сильнее'},
  {id:'horde',name:'Стайность',d:'зомби идут на шум издалека и сбиваются в орды'},
  {id:'rise',name:'Некроз',d:'погибшие от укусов встают вдвое чаще'}
];
const Strain={
  list:[],
  has(id){return this.list.includes(id);},
  add(){
    const left=MUTS.filter(m=>!this.has(m.id));if(!left.length)return null;
    const m=left[Math.random()*left.length|0];this.list.push(m.id);
    toast(`🧬 Мутация вируса: ${m.name} — ${m.d}`,'mut');Snd.play('mut');return m;
  },
  beta(){return 1+0.05*this.list.length+(this.has('air')?0.08:0);},
  names(){return this.list.map(id=>MUTS.find(m=>m.id===id).name);}
};

// ---------- Общая эпидемическая модель для уровней 2 и 3 ----------
// S — здоровые, E — инкубация (выглядят здоровыми), I — активные зомби, L — поздние зомби, D — погибшие, Q — изолированные
function nodeStep(n,P,dt,betaMul,killAdd,defMul){
  const N=n.S+n.E+n.I+n.L;if(N<=P.eps)return;
  const zf=(n.I+n.L)/N;
  const force=(P.wE*n.E+n.I+P.wL*n.L)/N;
  const inf=Math.min(n.S,P.beta*betaMul*n.S*force*dt);
  const eaten=Math.min(n.S-inf,P.kill*(n.I+0.5*n.L)*n.S/N*dt);
  const eToI=Math.min(n.E,n.E*dt/P.incub);
  const iToL=Math.min(n.I,n.I*dt/P.active);
  const def=P.def*defMul*(1-zf)*(1-zf)+killAdd;
  const kI=Math.min(n.I,def*n.I*dt),kL=Math.min(n.L,def*0.6*n.L*dt);
  n.S-=inf+eaten;n.E+=inf-eToI;n.I+=eToI-iToL-kI;n.L+=iToL-kL;n.D+=eaten+kI+kL;
  for(const k of ['S','E','I','L'])if(n[k]<P.eps*0.01)n[k]=0;
}
const aliveOf=n=>n.S+n.E+n.I+n.L;
const infOf=n=>n.E+n.I+n.L;
const detOf=n=>{const N=aliveOf(n);return N>0?(n.I+n.L+0.2*n.E)/N:0;};
function qpt(ax,ay,cx,cy,bx,by,t){const u=1-t;return[u*u*ax+2*u*t*cx+t*t*bx,u*u*ay+2*u*t*cy+t*t*by];}
function distToCurve(px,py,ax,ay,cx,cy,bx,by){
  let best=1e9;for(let k=0;k<=20;k++){const[x,y]=qpt(ax,ay,cx,cy,bx,by,k/20);const d=(x-px)**2+(y-py)**2;if(d<best)best=d;}return Math.sqrt(best);
}

/* =====================================================================
   УРОВЕНЬ 1: ГОРОД
   Улицы — граф: узлы-перекрёстки и рёбра-улицы. Жители идут от узла к узлу
   по таблицам «следующего шага» (Дейкстра от каждой цели, лениво, с бюджетом на кадр).
   Зомби, полиция и санитары двигаются свободно и сталкиваются со зданиями
   по растровой маске проходимости. Данные агентов — в типизированных массивах.
   ===================================================================== */
const L1=(()=>{
  const W=1800,H=1100,MR=3,MW=Math.ceil(W/MR),MH=Math.ceil(H/MR),NM=MW*MH;
  const HL=0,I1=1,I2=2,ACT=3,LATE=4,DEAD=5,ISO=6,ESC=7;   // здоров, скрытая инкубация, симптомы, активный, поздний, мёртв, изолирован, бежал
  const NCIV=2000,MAXA=2700,SPH=4;                         // SPH — реальных секунд в игровом часе при 1×
  const COST={turret:350,sniper:250,heli:400,bar:35,checkpoint:200,test:150,medic:300,curfew:200,station:80};
  const DNAMES=['ДОКИ','СТАРЫЙ ГОРОД','РЫНОК','СОБОРНЫЙ','ЦЕНТР','ФАБРИЧНЫЙ','УНИВЕРСИТЕТ','НАБЕРЕЖНАЯ','НОВЫЙ КВАРТАЛ','ВОКЗАЛЬНЫЙ'];
  const SNAMES=['Северная','Площадь Свободы','Университет','Старый порт','Центральная','Вокзал','Набережная','Собор','Промзона'];
  const LINES=[{name:'Красная',c:'#e0524b',st:[3,4,5]},{name:'Зелёная',c:'#5cc46a',st:[1,4,7]},{name:'Жёлтая',c:'#e3b844',st:[0,1,2]},{name:'Синяя',c:'#4f8fe0',st:[6,7,8]}];

  // ----- агенты (структура массивов) -----
  const F32=()=>new Float32Array(MAXA),U8=()=>new Uint8Array(MAXA),I16=()=>new Int16Array(MAXA);
  const ax=F32(),ay=F32(),aspd=F32(),atimer=F32(),astage=F32(),ahp=F32(),alane=F32(),acd=F32(),athink=F32(),aent=F32(),amark=F32(),aride=F32(),apanic=F32(),astuck=F32(),amw=F32(),azx=F32(),azy=F32();
  const ast=U8(),atype=U8(),amode=U8(),aflag=U8();
  const an0=I16(),an1=I16(),adest=I16(),aplace=I16(),ahome=I16(),awork=I16(),apass=I16(),acp=I16(),aex=I16(),ain=I16(),aqd=I16();
  const atgt=new Int32Array(MAXA);
  const ARR={ax,ay,aspd,atimer,astage,ahp,alane,acd,athink,aent,amark,aride,apanic,astuck,amw,azx,azy,ast,atype,amode,aflag,an0,an1,adest,aplace,ahome,awork,apass,acp,aex,ain,aqd,atgt};
  // режимы: 0 идёт, 1 в здании, 2 в метро, 3 в очереди, 4 паника, 5 гуляет, 6 путь перекрыт, 7 зомби идёт на шум
  // флаги: 1 иммунитет, 2 помечен тестом, 4 труп встанет
  let NA=0,S=null;

  // ----- город -----
  let NN=0,nx,ny,adj,nodeB,isExit,NE=0,ea,eb,elen,ew,ek,eblock,ecp;
  let Bd=[],P=[],D=[],ST=[],mDist=null,parks=[],coastWp=[],coastSp=[],blvd=null;
  let baseMask,mask,barAt,nearNode,mapCv=null,fields=[],budget=0,bOcc,bInc,nodeD;
  let coastW,coastS,isWater;
  const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&mask[(y/MR|0)*MW+(x/MR|0)]===1;
  const cellOf=(x,y)=>clamp(y/MR|0,0,MH-1)*MW+clamp(x/MR|0,0,MW-1);
  const nodeAt=(x,y)=>nearNode[cellOf(x,y)];
  const hour=()=>S.time%24;
  const night=()=>{const h=hour();return h>=20||h<6;};

  // ----- пространственная сетка -----
  const GC=24,GX=Math.ceil(W/GC),GY=Math.ceil(H/GC),NG=GX*GY;
  const zS=new Int32Array(NG+1),zI=new Int32Array(MAXA),lS=new Int32Array(NG+1),lI=new Int32Array(MAXA),cur=new Int32Array(NG+1),acell=new Int32Array(MAXA);

  // ===================== ГЕНЕРАЦИЯ ГОРОДА =====================
  function gen(seed){
    const r=mulberry32(seed),ph=r()*6;
    coastW=y=>55+30*Math.sin(y/150+ph)+(y>620?(y-620)*0.32:0);
    coastS=x=>H-62-24*Math.sin(x/170+ph*1.3)-(x<520?(520-x)*0.22:0);
    isWater=(x,y)=>x<coastW(y)||y>coastS(x);
    const X=[],Y=[],EA=[],EB=[],EW=[],EK=[],wv=[];
    const addN=(x,y)=>{X.push(x);Y.push(y);return X.length-1;};
    const addE=(a,b,w,k)=>{EA.push(a);EB.push(b);EW.push(w);EK.push(k);return EA.length-1;};
    // решётка: восток — ровная сетка, запад — старый город (поворот и искажения улиц)
    const SX=62,SY=50,cols=Math.ceil(W/SX)+2,rows=Math.ceil(H/SY)+2,id=new Int32Array(cols*rows).fill(-1);
    const cx0=360,cy0=560;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const bx=(i-0.5)*SX,by=(j-0.5)*SY,w=sstep(980,640,bx),an=0.3*w,dx=bx-cx0,dy=by-cy0;
      let x=cx0+dx*Math.cos(an)-dy*Math.sin(an),y=cy0+dx*Math.sin(an)+dy*Math.cos(an);
      x+=w*(13*Math.sin(by/83+i*0.7)+(r()-0.5)*9);y+=w*(11*Math.cos(bx/97-j*0.5)+(r()-0.5)*9);
      if(x<-15||x>W+15||y<-15||y>H+15||isWater(x,y))continue;
      id[j*cols+i]=addN(x,y);wv.push(w);
    }
    const g=(i,j)=>i<0||j<0||i>=cols||j>=rows?-1:id[j*cols+i];
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const a=g(i,j);if(a<0)continue;const w=wv[a],old=w>0.5;
      const b=g(i+1,j);if(b>=0&&r()>(old?0.07:0.015)&&Math.hypot(X[a]-X[b],Y[a]-Y[b])<SX*1.7)addE(a,b,old?7:(j%4===1?11:8),old?0:j%4===1?2:1);
      const c=g(i,j+1);if(c>=0&&r()>(old?0.07:0.015)&&Math.hypot(X[a]-X[c],Y[a]-Y[c])<SY*1.9)addE(a,c,old?7:(i%3===1?13:8),old?0:i%3===1?3:1);
      const d=g(i+1,j+1);if(old&&d>=0&&r()<0.05)addE(a,d,6,0);
    }
    // диагональный бульвар через сетку: режем пересекаемые улицы
    const bx0=1020,by0=-15,bx1=1790,by1=990;blvd=[bx0,by0,bx1,by1];
    const hits=[];
    for(let e=0;e<EA.length;e++){const h=segX(bx0,by0,bx1,by1,X[EA[e]],Y[EA[e]],X[EB[e]],Y[EB[e]]);if(h)hits.push([h[0],e,h[1]]);}
    hits.sort((p,q)=>p[0]-q[0]);
    let prev=-1;
    for(const[t,e]of hits){
      const x=lerp(bx0,bx1,t),y=lerp(by0,by1,t),n=addN(x,y);wv.push(0);
      const b=EB[e];EB[e]=n;addE(n,b,EW[e],EK[e]);
      if(prev>=0)addE(prev,n,15,4);prev=n;
    }
    // мосты и трассы — выезды из города
    const exits=[];
    const pick=(f,score)=>{let best=-1,bs=-1e9;for(let k=0;k<X.length;k++){if(!f(X[k],Y[k]))continue;const s=score(X[k],Y[k]);if(s>bs){bs=s;best=k;}}return best;};
    const mk=(n,x,y,w,k)=>{if(n<0)return;const e=addN(x,y);wv.push(0);addE(n,e,w,k);exits.push(e);};
    let n;
    n=pick((x,y)=>y>330&&y<620,(x)=>-x);if(n>=0)mk(n,-40,Y[n]+12,12,5);
    n=pick((x,y)=>x>880&&x<1300,(x,y)=>y);if(n>=0)mk(n,X[n]-14,H+40,12,5);
    n=pick((x,y)=>x>1300&&x<1600,(x,y)=>-y);if(n>=0)mk(n,X[n],-40,14,6);
    n=pick((x,y)=>y>380&&y<720,(x)=>x);if(n>=0)mk(n,W+40,Y[n],14,6);
    // оставляем крупнейшую связную компоненту
    const NA0=X.length,ad=Array.from({length:NA0},()=>[]);
    for(let e=0;e<EA.length;e++){ad[EA[e]].push(e);ad[EB[e]].push(e);}
    const comp=new Int32Array(NA0).fill(-1);let bestC=-1,bestN=0;
    for(let s=0;s<NA0;s++){if(comp[s]>=0)continue;const q=[s];comp[s]=s;let c=0;
      while(q.length){const u=q.pop();c++;for(const e of ad[u]){const v=EA[e]===u?EB[e]:EA[e];if(comp[v]<0){comp[v]=s;q.push(v);}}}
      if(c>bestN){bestN=c;bestC=s;}}
    const remap=new Int32Array(NA0).fill(-1);NN=0;
    for(let k=0;k<NA0;k++)if(comp[k]===bestC)remap[k]=NN++;
    nx=new Float32Array(NN);ny=new Float32Array(NN);isExit=new Uint8Array(NN);
    for(let k=0;k<NA0;k++)if(remap[k]>=0){nx[remap[k]]=X[k];ny[remap[k]]=Y[k];}
    for(const e of exits)if(remap[e]>=0)isExit[remap[e]]=1;
    const E2=[];for(let e=0;e<EA.length;e++){const a=remap[EA[e]],b=remap[EB[e]];if(a>=0&&b>=0&&a!==b)E2.push([a,b,EW[e],EK[e]]);}
    NE=E2.length;ea=new Int16Array(NE);eb=new Int16Array(NE);elen=new Float32Array(NE);ew=new Uint8Array(NE);ek=new Uint8Array(NE);eblock=new Uint8Array(NE);ecp=new Int16Array(NE).fill(-1);
    adj=Array.from({length:NN},()=>[]);
    E2.forEach(([a,b,w,k],e)=>{ea[e]=a;eb[e]=b;ew[e]=w;ek[e]=k;elen[e]=Math.hypot(nx[a]-nx[b],ny[a]-ny[b]);adj[a].push(e);adj[b].push(e);});
    // кварталы: каждая ячейка решётки — квартал со зданиями, парк или площадь
    Bd=[];parks=[];
    const nearB=(x,y)=>distSeg(x,y,bx0,by0,bx1,by1)[0];
    for(let j=0;j<rows-1;j++)for(let i=0;i<cols-1;i++){
      const q=[g(i,j),g(i+1,j),g(i+1,j+1),g(i,j+1)];if(q.some(v=>v<0||remap[v]<0))continue;
      const pts=q.map(v=>[X[v],Y[v]]),cx=pts.reduce((s,p)=>s+p[0],0)/4,cy=pts.reduce((s,p)=>s+p[1],0)/4;
      const ins=pts.map(([x,y])=>{const l=Math.hypot(cx-x,cy-y)||1,k=Math.min(0.42,9/l);return[x+(cx-x)*k,y+(cy-y)*k];});
      const nodes=q.map(v=>remap[v]);
      const nearest=(x,y)=>{let b=nodes[0],bd=1e9;for(const v of nodes){const d=(nx[v]-x)**2+(ny[v]-y)**2;if(d<bd){bd=d;b=v;}}return b;};
      const rv=r();
      if(rv<0.08||rv<0.11){parks.push({pts:ins,kind:rv<0.08?'park':'plaza',cx,cy,node:nearest(cx,cy)});continue;}
      const wdt=Math.hypot(ins[1][0]-ins[0][0],ins[1][1]-ins[0][1]),hgt=Math.hypot(ins[3][0]-ins[0][0],ins[3][1]-ins[0][1]);
      let nxs=clamp(Math.round(wdt/22),1,3),nys=clamp(Math.round(hgt/22),1,2);if(r()<0.15)nxs=nys=1;
      const gu=2.4/Math.max(10,wdt),gv=2.4/Math.max(10,hgt);
      const bil=(u,v)=>{const tx=lerp(ins[0][0],ins[1][0],u),ty=lerp(ins[0][1],ins[1][1],u),bxx=lerp(ins[3][0],ins[2][0],u),byy=lerp(ins[3][1],ins[2][1],u);return[lerp(tx,bxx,v),lerp(ty,byy,v)];};
      for(let su=0;su<nxs;su++)for(let sv=0;sv<nys;sv++){
        const u0=su/nxs+gu,u1=(su+1)/nxs-gu,v0=sv/nys+gv,v1=(sv+1)/nys-gv;
        const c=[bil(u0,v0),bil(u1,v0),bil(u1,v1),bil(u0,v1)];
        const bcx=(c[0][0]+c[2][0])/2,bcy=(c[0][1]+c[2][1])/2;
        if(c.some(([x,y])=>isWater(x,y))||nearB(bcx,bcy)<16)continue;
        const area=Math.abs((c[1][0]-c[0][0])*(c[3][1]-c[0][1])-(c[1][1]-c[0][1])*(c[3][0]-c[0][0]));
        if(area<60)continue;
        const tv=r(),dc=Math.hypot(bcx-W*0.55,bcy-H*0.45);
        const type=dc<380?(tv<0.42?'office':tv<0.62?'shop':'house'):(tv<0.7?'house':tv<0.84?'office':'shop');
        Bd.push({pts:c.flat(),cx:bcx,cy:bcy,type,node:nearest(bcx,bcy),area,shade:r(),turret:0,sniper:0,cd:0,ang:r()*6.28,scd:0,sang:0,district:0});
      }
    }
    // особые здания: больница и полицейский участок
    const byDist=(x,y)=>Bd.filter(b=>b.type==='office').sort((p,q)=>((p.cx-x)**2+(p.cy-y)**2)-((q.cx-x)**2+(q.cy-y)**2));
    const pol=byDist(W*0.52,H*0.42)[0];if(pol)pol.type='police';
    const hos=byDist(W*0.38,H*0.55)[0];if(hos)hos.type='hospital';
    // районы: дальние друг от друга точки среди зданий
    D=[];const seeds=[Bd[r()*Bd.length|0]];
    while(seeds.length<DNAMES.length){let best=null,bd=-1;for(const b of Bd){let m=1e18;for(const s of seeds)m=Math.min(m,(b.cx-s.cx)**2+(b.cy-s.cy)**2);if(m>bd){bd=m;best=b;}}seeds.push(best);}
    seeds.forEach((s,k)=>D.push({name:DNAMES[k],sx:s.cx,sy:s.cy,x:0,y:0,n:0,curfew:false}));
    for(const b of Bd){let best=0,bd=1e18;D.forEach((d,k)=>{const dd=(b.cx-d.sx)**2+(b.cy-d.sy)**2;if(dd<bd){bd=dd;best=k;}});b.district=best;D[best].x+=b.cx;D[best].y+=b.cy;D[best].n++;}
    for(const d of D){if(d.n){d.x/=d.n;d.y/=d.n;}else{d.x=d.sx;d.y=d.sy;}}
    // места назначения: здания, парки, выезды
    P=[];nodeB=Array.from({length:NN},()=>[]);
    Bd.forEach((b,k)=>{b.place=P.length;P.push({kind:'bld',node:b.node,b:k,x:b.cx,y:b.cy,district:b.district});nodeB[b.node].push(k);});
    for(const p of parks){p.place=P.length;P.push({kind:'park',node:p.node,b:-1,x:p.cx,y:p.cy,district:0});}
    for(let v=0;v<NN;v++)if(isExit[v])P.push({kind:'exit',node:v,b:-1,x:nx[v],y:ny[v],district:0});
    nodeD=new Int8Array(NN);
    for(let v=0;v<NN;v++){if(nodeB[v].length){nodeD[v]=Bd[nodeB[v][0]].district;continue;}let best=0,bd=1e18;for(const b of Bd){const d=(b.cx-nx[v])**2+(b.cy-ny[v])**2;if(d<bd){bd=d;best=b.district;}}nodeD[v]=best;}
    // метро: 9 станций на сетке 3×3, 4 линии
    ST=[];
    for(let k=0;k<9;k++){
      const tx=[0.22,0.52,0.82][k%3]*W,ty=[0.2,0.5,0.78][k/3|0]*H;
      let best=0,bd=1e18;for(let v=0;v<NN;v++){if(isExit[v]||ST.some(s=>s.node===v))continue;const d=(nx[v]-tx)**2+(ny[v]-ty)**2;if(d<bd){bd=d;best=v;}}
      ST.push({name:SNAMES[k],node:best,x:nx[best],y:ny[best],closed:false,lines:[]});
    }
    LINES.forEach((l,li)=>l.st.forEach(s=>ST[s].lines.push(li)));
    mDist=Array.from({length:9},(_,a)=>Array.from({length:9},(_,b)=>a===b?0:1e9));
    for(const l of LINES)for(let k=0;k+1<l.st.length;k++){const a=l.st[k],b=l.st[k+1],d=Math.hypot(ST[a].x-ST[b].x,ST[a].y-ST[b].y);mDist[a][b]=mDist[b][a]=d;}
    for(let k=0;k<9;k++)for(let a=0;a<9;a++)for(let b=0;b<9;b++)if(mDist[a][k]+mDist[k][b]<mDist[a][b])mDist[a][b]=mDist[a][k]+mDist[k][b];
    // береговая линия для отрисовки
    coastWp=[];for(let y=-20;y<=H+20;y+=8)coastWp.push([coastW(y),y]);
    coastSp=[];for(let x=-20;x<=W+20;x+=8)coastSp.push([x,coastS(x)]);
    buildMask();
  }
  // растровая маска проходимости: улицы, парки, площади
  function buildMask(){
    const c=document.createElement('canvas');c.width=MW;c.height=MH;const g=c.getContext('2d');
    g.fillStyle='#000';g.fillRect(0,0,MW,MH);g.scale(1/MR,1/MR);g.fillStyle='#fff';g.strokeStyle='#fff';g.lineCap='round';
    for(const p of parks){g.beginPath();for(let k=0;k<4;k++){const[x,y]=p.pts[k];k?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();g.fill();}
    for(let e=0;e<NE;e++){g.lineWidth=ew[e]+3;g.beginPath();g.moveTo(nx[ea[e]],ny[ea[e]]);g.lineTo(nx[eb[e]],ny[eb[e]]);g.stroke();}
    const d=g.getImageData(0,0,MW,MH).data;baseMask=new Uint8Array(NM);
    for(let i=0;i<NM;i++)baseMask[i]=d[i*4]>127?1:0;
    mask=new Uint8Array(baseMask);barAt=new Int16Array(NM).fill(-1);
    // ближайший узел для каждой клетки (обход в ширину от всех узлов)
    nearNode=new Int16Array(NM).fill(-1);const q=new Int32Array(NM);let h=0,t=0;
    for(let v=0;v<NN;v++){if(nx[v]<0||ny[v]<0||nx[v]>=W||ny[v]>=H)continue;const k=cellOf(nx[v],ny[v]);if(nearNode[k]<0){nearNode[k]=v;q[t++]=k;}}
    while(h<t){const k=q[h++],x=k%MW,y=k/MW|0,v=nearNode[k];
      if(x>0&&nearNode[k-1]<0){nearNode[k-1]=v;q[t++]=k-1;}if(x<MW-1&&nearNode[k+1]<0){nearNode[k+1]=v;q[t++]=k+1;}
      if(y>0&&nearNode[k-MW]<0){nearNode[k-MW]=v;q[t++]=k-MW;}if(y<MH-1&&nearNode[k+MW]<0){nearNode[k+MW]=v;q[t++]=k+MW;}}
  }
  function rebuildMask(){
    mask.set(baseMask);barAt.fill(-1);
    S.bars.forEach((b,id)=>{
      if(!b)return;const c=Math.cos(b.ang),s=Math.sin(b.ang),x0=b.x-c*b.len/2,y0=b.y-s*b.len/2,x1=b.x+c*b.len/2,y1=b.y+s*b.len/2;
      for(let y=Math.floor((Math.min(y0,y1)-4)/MR);y<=Math.ceil((Math.max(y0,y1)+4)/MR);y++)for(let x=Math.floor((Math.min(x0,x1)-4)/MR);x<=Math.ceil((Math.max(x0,x1)+4)/MR);x++){
        if(x<0||y<0||x>=MW||y>=MH)continue;if(distSeg((x+.5)*MR,(y+.5)*MR,x0,y0,x1,y1)[0]<=3.6){const k=y*MW+x;mask[k]=0;barAt[k]=id;}}
    });
  }

  // ===================== МАРШРУТЫ =====================
  const hpN=new Int32Array(32768),hpD=new Float32Array(32768);
  function dijkstra(d){
    const dist=new Float32Array(NN).fill(1e9),nh=new Int16Array(NN).fill(-1);let n=0;
    const push=(v,k)=>{let i=n++;hpN[i]=v;hpD[i]=k;while(i>0){const p=(i-1)>>1;if(hpD[p]<=hpD[i])break;[hpN[p],hpN[i]]=[hpN[i],hpN[p]];[hpD[p],hpD[i]]=[hpD[i],hpD[p]];i=p;}};
    const pop=()=>{const v=hpN[0],k=hpD[0];n--;hpN[0]=hpN[n];hpD[0]=hpD[n];let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<n&&hpD[l]<hpD[m])m=l;if(r<n&&hpD[r]<hpD[m])m=r;if(m===i)break;[hpN[m],hpN[i]]=[hpN[i],hpN[m]];[hpD[m],hpD[i]]=[hpD[i],hpD[m]];i=m;}return[v,k];};
    dist[d]=0;nh[d]=d;push(d,0);
    while(n){const[u,du]=pop();if(du>dist[u])continue;
      for(const e of adj[u]){if(eblock[e])continue;const v=ea[e]===u?eb[e]:ea[e],nd=du+elen[e];if(nd<dist[v]&&n<32760){dist[v]=nd;nh[v]=u;push(v,nd);}}}
    return nh;
  }

  function edgeBetween(u,v){for(const e of adj[u])if(ea[e]===v||eb[e]===v)return e;return -1;}

  // ===================== СЕТКА СОСЕДЕЙ =====================
  const isOut=i=>amode[i]!==1&&amode[i]!==2;
  function buildGrids(){
    zS.fill(0);lS.fill(0);
    for(let i=0;i<NA;i++){
      acell[i]=-1;const s=ast[i];if(s>=DEAD||!isOut(i))continue;
      const c=clamp(ay[i]/GC|0,0,GY-1)*GX+clamp(ax[i]/GC|0,0,GX-1);acell[i]=c;
      if(s===ACT||s===LATE)zS[c+1]++;else lS[c+1]++;

    cur.set(zS);for(let i=0;i<NA;i++){const c=acell[i];if(c>=0&&(ast[i]===ACT||ast[i]===LATE))zI[cur[c]++]=i;}
    cur.set(lS);for(let i=0;i<NA;i++){const c=acell[i];if(c>=0&&ast[i]<ACT)lI[cur[c]++]=i;}
  }
  function nearestZ(x,y,r){
    const x0=clamp((x-r)/GC|0,0,GX-1),x1=clamp((x+r)/GC|0,0,GX-1),y0=clamp((y-r)/GC|0,0,GY-1),y1=clamp((y+r)/GC|0,0,GY-1);let best=-1,bd=r*r;

  }
  // mode: 0 — здоровый (цель зомби), 1 — помеченный носитель (цель полиции)
  function nearestL(x,y,r,mode){
    const x0=clamp((x-r)/GC|0,0,GX-1),x1=clamp((x+r)/GC|0,0,GX-1),y0=clamp((y-r)/GC|0,0,GY-1),y1=clamp((y+r)/GC|0,0,GY-1);let best=-1,bd=r*r;

  function eachNear(x,y,r,fn){

  // ===================== ДВИЖЕНИЕ =====================
  function moveFree(i,mx,my){

  }
  // шаг к узлу an1 с боковым смещением (люди идут по своей «полосе» тротуара)
  function moveToNode(i,dt,mul){
    const v=an1[i],u=an0[i];let tx=nx[v],ty=ny[v];
    if(u>=0&&u!==v){const dx=nx[v]-nx[u],dy=ny[v]-ny[u],l=Math.hypot(dx,dy)||1;tx-=dy/l*alane[i];ty+=dx/l*alane[i];}

      an0[i]=v;an1[i]=opts.length?opts[Math.random()*opts.length|0]:(an0[i]>=0?an0[i]:v);

  }
  // навигация к точке: дальше 45 px — по графу, ближе — напрямую
  function navTo(i,tx,ty,dt,sp){

    return d;
  }

  // ===================== ЗАРАЖЕНИЕ =====================
  const fastK=()=>Strain.has('fast')?0.7:1;

  const silent=()=>Strain.has('silent');
  const wOf=i=>(ast[i]===I2?1:ast[i]===I1?0.4:0)*(aflag[i]&8?2.5:1);  // заразность носителя (симптомы сильнее; 8 — суперраспространитель)
  function infect(i,src){

    ast[i]=I1;astage[i]=rnd(18,30)*fastK();S.stats.infected++;if(src){const R=S.stats.routes||(S.stats.routes={});R[src]=(R[src]||0)+1;}
    if(amode[i]===1){bInc[ain[i]]+=0.4;amw[i]=0.4;}

  }
  function stageUp(i,ns){

    else if(amode[i]===2){S.mC+=wOf(i)-amw[i];amw[i]=wOf(i);}
  }
  function leaveQueue(i){if(amode[i]!==3)return;const c=S.cps[acp[i]];if(c){const q=c.q[aqd[i]],k=q.indexOf(i);if(k>=0)q.splice(k,1);}amode[i]=0;}
  function turnActive(i){
    if(amode[i]===1){const b=ain[i];bOcc[b]--;bInc[b]-=amw[i];ain[i]=-1;const n=Bd[b].node;ax[i]=nx[n]+rnd(-3,3);ay[i]=ny[n]+rnd(-3,3);}
    else if(amode[i]===2){S.mR--;S.mC-=amw[i];const n=ST[aex[i]].node;ax[i]=nx[n];ay[i]=ny[n];}
    leaveQueue(i);
    ast[i]=ACT;astage[i]=rnd(45,70);ahp[i]=1;aspd[i]=rnd(30,37)*(Strain.has('runners')?1.25:1);acd[i]=0;atgt[i]=-1;amode[i]=0;an1[i]=-1;aflag[i]&=~2;
    S.zSeen++;
    if(!S.alert){S.alert=true;toast('🚨 Первый зомби на улицах. Скрытые носители выглядят здоровыми.','bad');Snd.play('alarm');}
  }
  function kill(i,rise){

    ast[i]=DEAD;amode[i]=0;fx('blood',ax[i],ay[i]);
    if(rise&&Math.random()<(Strain.has('rise')?0.6:0.3)){aflag[i]|=4;S.risers.push([i,rnd(15,25)]);}
  }
  function bite(z,j){

  }
  function hitZombie(j,dmg){

  }
  function noise(x,y){for(const n of S.noise)if((n.x-x)**2+(n.y-y)**2<1600){n.t=3;return;}if(S.noise.length<40)S.noise.push({x,y,t:3});}
  function shoot(x,y,j,acc,dmg,kind){

  }
  function fx(k,x,y,x2,y2){

  // ===================== ЖИТЕЛИ =====================
  function nearestStation(x,y,r){let best=-1,bd=r*r;ST.forEach((s,k)=>{if(s.closed)return;const d=(s.x-x)**2+(s.y-y)**2;if(d<bd){bd=d;best=k;}});return best;}
  function goTo(i,pl){
    let p=P[pl];

    aplace[i]=pl;aex[i]=-1;amode[i]=0;
    // далёкие поездки — на метро
    if(p.kind!=='exit'&&Math.hypot(p.x-ax[i],p.y-ay[i])>520){
      const sa=nearestStation(ax[i],ay[i],380),sb=nearestStation(p.x,p.y,380);

    }
    adest[i]=p.node;
  }
  const randLeisure=i=>{const r=Math.random(),s=S.shops;if((r<0.35||!s.length)&&parks.length)return parks[Math.random()*parks.length|0].place;if(!s.length)return Bd[ahome[i]].place;return Bd[s[Math.random()*s.length|0]].place;};
  function nextPlace(i,b){
    const h=hour();
    if(S.alert&&S.zVis>20&&Math.random()<Math.min(0.3,S.zVis/700)){ // бегство из города
      let best=-1,bd=1e18;for(let k=0;k<P.length;k++)if(P[k].kind==='exit'){const d=(P[k].x-ax[i])**2+(P[k].y-ay[i])**2;if(d<bd){bd=d;best=k;}}
      if(best>=0)return best;
    }
    if(b===ahome[i]){if(h>=6&&h<11&&awork[i]>=0)return Bd[awork[i]].place;return randLeisure(i);}
    if(b===awork[i]&&Math.random()<0.6)return Bd[ahome[i]].place;

  }
  function enterBuilding(i,b){
    ain[i]=b;amode[i]=1;bOcc[b]++;amw[i]=wOf(i);bInc[b]+=amw[i];aent[i]=S.time;apass[i]=-1;
    const h=hour(),curfew=S.zSeen>25?2.5:1;let stay;
    if(b===ahome[i]){if(h>=18||h<6){const t=6.5+Math.random()*3;stay=(t-h+24)%24;if(stay<1)stay+=24;}else stay=rnd(1,3.5)*curfew;}
    else if(b===awork[i]){const t=16.5+Math.random()*2;stay=clamp((t-h+24)%24,1,10);}

  }
  function leaveBuilding(i){
    const b=ain[i];
    if(b===ahome[i]&&D[Bd[b].district].curfew){atimer[i]=2*SPH;return;}  // комендантский час
    if(b===ahome[i]&&S.zVis>10&&Math.random()<Math.min(0.75,S.zVis/50)){atimer[i]=rnd(1.5,3)*SPH;return;}  // люди прячутся по домам
    if(ast[i]===HL){const other=bInc[b];if(other>0){const stay=S.time-aent[i];if(Math.random()<1-Math.exp(-0.3*airK()*other*stay/Math.max(4,bOcc[b])))infect(i,'bld');}}
    const next=nextPlace(i,b);

  function arrive(i){
    const p=P[aplace[i]];

      const sa=ST.findIndex(s=>s.node===an0[i]);
      if(sa>=0&&!ST[sa].closed&&!ST[aex[i]].closed){
        amode[i]=2;aride[i]=mDist[sa][aex[i]]/260+2;amw[i]=wOf(i);S.mR++;S.mC+=amw[i];aent[i]=S.t;return;
      }

  function exitMetro(i){

    if(ast[i]===HL){const ride=S.t-aent[i];if(Math.random()<1-Math.exp(-0.22*airK()*Math.max(0,S.mC)*ride/Math.max(15,S.mR+1)))infect(i,'metro');}
    ax[i]=nx[n]+rnd(-3,3);ay[i]=ny[n]+rnd(-3,3);an0[i]=an1[i]=n;aex[i]=-1;amode[i]=0;adest[i]=P[aplace[i]].node;
  }
  function closeContact(i){

  function startPanic(i,z){

  }
  function updCiv(i,dt){
    const m=amode[i];

    if(m===2){aride[i]-=dt;if(aride[i]<=0)exitMetro(i);return;}
    athink[i]-=dt;
    if(athink[i]<=0){
      athink[i]=0.25+Math.random()*0.1;
      if(S.alert&&m!==4){const z=nearestZ(ax[i],ay[i],55);if(z>=0){startPanic(i,z);return;}}

    if(m===3){queueStep(i,dt);return;}
    if(m===4){

        for(const e of adj[v]){if(eblock[e])continue;const w=ea[e]===v?eb[e]:ea[e];const d=z>=0?(nx[w]-ax[z])**2+(ny[w]-ay[z])**2:Math.random();if(d>bd){bd=d;best=w;}}

    }
    if(m===5){atimer[i]-=dt;if(atimer[i]<=0){an1[i]=an0[i];goTo(i,Bd[ahome[i]].place);}
      else{const p=P[aplace[i]];if(Math.random()<dt)afx(i,p);steerFree(i,azx[i],azy[i],aspd[i]*0.35,dt);}return;}
    if(m===6){atimer[i]-=dt;if(atimer[i]<=0){amode[i]=0;}return;}
    walk(i,dt);
  }
  function afx(i,p){azx[i]=p.x+rnd(-22,22);azy[i]=p.y+rnd(-22,22);}
  function walk(i,dt){
    if(!moveToNode(i,dt,1))return;
    const u=an1[i];an0[i]=u;
    if(u===adest[i]){arrive(i);return;}
    const f=getField(adest[i]);if(!f)return;
    const nxt=f[u];
    if(nxt<0){amode[i]=6;atimer[i]=rnd(3,6);adest[i]=Bd[ahome[i]].node;aplace[i]=Bd[ahome[i]].place;aex[i]=-1;return;}
    an1[i]=nxt;
    const e=edgeBetween(u,nxt);
    if(e>=0&&ecp[e]>=0&&apass[i]!==ecp[e]){const c=S.cps[ecp[e]];const d=ea[e]===u?0:1;c.q[d].push(i);amode[i]=3;acp[i]=c.id;aqd[i]=d;}
  }
  function queueStep(i,dt){
    const c=S.cps[acp[i]];if(!c){amode[i]=0;return;}
    const q=c.q[aqd[i]],k=q.indexOf(i);if(k<0){amode[i]=0;return;}
    const u=an0[i],v=an1[i],dx=nx[v]-nx[u],dy=ny[v]-ny[u],l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l;
    const tx=c.x-ux*(5+k*4.2)-uy*alane[i]*0.35,ty=c.y-uy*(5+k*4.2)+ux*alane[i]*0.35;
    const ddx=tx-ax[i],ddy=ty-ay[i],d=Math.hypot(ddx,ddy),s=aspd[i]*dt;

  }

  // ===================== ЗОМБИ =====================
  function updZombie(i,dt){
    acd[i]-=dt;athink[i]-=dt;
    const nm=S.night?1.15:1,sp=aspd[i]*nm;
    if(athink[i]<=0){
      athink[i]=0.3+Math.random()*0.2;
      atgt[i]=nearestL(ax[i],ay[i],(ast[i]===ACT?50:32)*(S.night?1.25:1),0);
      if(atgt[i]<0&&amode[i]!==7){const R=Strain.has('horde')?230:130;for(const n of S.noise)if((n.x-ax[i])**2+(n.y-ay[i])**2<R*R){amode[i]=7;azx[i]=n.x+rnd(-15,15);azy[i]=n.y+rnd(-15,15);break;}}
    }
    const j=atgt[i];let blk=-1;
    if(acd[i]>1.2)return;  // занят жертвой
    if(j>=0&&ast[j]===HL&&isOut(j)){
      const dx=ax[j]-ax[i],dy=ay[j]-ay[i],d=Math.sqrt(dx*dx+dy*dy);
      if(d<5){if(acd[i]<=0)bite(i,j);}else blk=moveFree(i,dx/d*sp*dt,dy/d*sp*dt);
    }else{
      atgt[i]=-1;
      if(amode[i]===7){blk=steerFree(i,azx[i],azy[i],sp*0.8,dt);if((azx[i]-ax[i])**2+(azy[i]-ay[i])**2<64||astuck[i]>1){amode[i]=0;an1[i]=-1;}}
      else{
        blk=wanderGraph(i,dt,sp*0.5);
        const v=an0[i];
        if(v>=0&&nodeB[v].length&&(nx[v]-ax[i])**2+(ny[v]-ay[i])**2<64&&Math.random()<0.15*dt){
          const b=nodeB[v][Math.random()*nodeB[v].length|0];if(bOcc[b]-bInc[b]>0.5)breakIn(b);
        }
      }
    }
    if(blk>=0){
      const bar=barAt[blk];if(bar>=0)damageBar(bar,(ast[i]===LATE?5:3)*dt);
      astuck[i]+=dt;if(astuck[i]>0.8){astuck[i]=0;an1[i]=-1;if(amode[i]===7)amode[i]=0;}
    }else astuck[i]=Math.max(0,astuck[i]-dt);
  }
  function breakIn(b){
    const st=Math.random()*NA|0;
    for(let k=0;k<NA;k++){const j=(st+k)%NA;if(amode[j]===1&&ain[j]===b&&ast[j]===HL){infect(j,'bite');Snd.play('bite');return;}}
  }

  // ===================== ПОЛИЦИЯ И САНИТАРЫ =====================
  function updPolice(i,dt){
    acd[i]-=dt;athink[i]-=dt;
    if(athink[i]<=0){athink[i]=0.25;atgt[i]=nearestZ(ax[i],ay[i],170);if(atgt[i]<0)atgt[i]=-2-Math.max(-1,nearestL(ax[i],ay[i],220,1));}
    const j=atgt[i];
    if(j>=0&&(ast[j]===ACT||ast[j]===LATE)){
      const dx=ax[j]-ax[i],dy=ay[j]-ay[i],d=Math.hypot(dx,dy)||1;
      if(d<75){if(acd[i]<=0){acd[i]=0.85;shoot(ax[i],ay[i],j,ast[j]===ACT?0.7:0.55,1,'police');}if(d<18)moveFree(i,-dx/d*aspd[i]*0.8*dt,-dy/d*aspd[i]*0.8*dt);}
      else navTo(i,ax[j],ay[j],dt,aspd[i]);
      return;
    }
    const m=j<=-2?-2-j:-1;
    if(m>=0&&(aflag[m]&2)&&isOut(m)&&ast[m]<ACT){ // арест помеченного носителя
      const d=navTo(i,ax[m],ay[m],dt,aspd[i]);
      if(d<6){leaveQueue(m);ast[m]=ISO;aflag[m]&=~2;S.stats.arrested++;S.money+=20;fx('iso',ax[m],ay[m]);Snd.play('iso');atgt[i]=-1;}
      return;
    }
    wanderGraph(i,dt,aspd[i]*0.5);
  }
  function updMedic(i,dt){
    athink[i]-=dt;
    if(athink[i]<=0){
      athink[i]=0.5;
      const z=nearestZ(ax[i],ay[i],60);apanic[i]=z>=0?1.5:apanic[i];if(z>=0){atgt[i]=z;}
      else{let best=-1,bd=320*320;for(const[k]of S.risers){if(!(aflag[k]&4))continue;const d=(ax[k]-ax[i])**2+(ay[k]-ay[i])**2;if(d<bd){bd=d;best=k;}}atgt[i]=best>=0?-2-best:-1;}
      // на ходу тестируют прохожих
      eachNear(ax[i],ay[i],26,j=>{if((ast[j]===I1||ast[j]===I2)&&!(aflag[j]&2)&&Math.random()<(ast[j]===I2?0.8:0.35)*(silent()?0.6:1)){aflag[j]|=2;amark[j]=45;}});
    }
    if(apanic[i]>0){apanic[i]-=dt;const z=atgt[i];if(z>=0){const dx=ax[i]-ax[z],dy=ay[i]-ay[z],d=Math.hypot(dx,dy)||1;if(moveFree(i,dx/d*aspd[i]*1.4*dt,dy/d*aspd[i]*1.4*dt)>=0)wanderGraph(i,dt,aspd[i]);}return;}
    const c=atgt[i]<=-2?-2-atgt[i]:-1;
    if(c>=0&&(aflag[c]&4)){const d=navTo(i,ax[c],ay[c],dt,aspd[i]);if(d<5){aflag[c]&=~4;S.stats.collected++;S.money+=5;fx('iso',ax[c],ay[c]);atgt[i]=-1;}return;}
    wanderGraph(i,dt,aspd[i]*0.6);
  }

  // ===================== ОБОРОНА =====================
  function updDefense(dt){
    for(const b of Bd){
      if(b.turret){b.cd-=dt;if(b.cd<=0){const z=nearestZ(b.cx,b.cy,120);if(z>=0){b.cd=0.13;b.ang=Math.atan2(ay[z]-b.cy,ax[z]-b.cx);shoot(b.cx,b.cy,z,0.45,1,'turret');}else b.cd=0.2;}}
      if(b.sniper){b.scd-=dt;if(b.scd<=0){const z=nearestZ(b.cx,b.cy,280);if(z>=0){b.scd=2.2;b.sang=Math.atan2(ay[z]-b.cy,ax[z]-b.cx);shoot(b.cx,b.cy,z,0.96,3,'sniper');}else b.scd=0.3;}}
    }
    for(const c of S.cps){
      if(!c)continue;
      for(let d=0;d<2;d++){
        const q=c.q[d];
        for(let k=q.length-1;k>=0;k--){const i=q[k];if(amode[i]!==3||ast[i]>=ACT||acp[i]!==c.id)q.splice(k,1);}
        const f=q[0];
        if(f===undefined){c.proc[d]=0;continue;}
        if(Math.hypot(ax[f]-c.x,ay[f]-c.y)<7.5){
          c.proc[d]+=dt;
          if(c.proc[d]>=1.1){
            c.proc[d]=0;q.shift();
            const det=ast[f]===I2?(silent()?0.55:0.8):ast[f]===I1?(silent()?0.1:0.2):0;
            if(Math.random()<det){ast[f]=ISO;amode[f]=0;S.stats.caught++;S.money+=25;fx('iso',ax[f],ay[f]);Snd.play('iso');}
            else{apass[f]=c.id;amode[f]=0;}
          }
        }
      }
      c.cd-=dt;
      if(c.cd<=0){const z=nearestZ(c.x,c.y,55);if(z>=0){c.cd=0.6;shoot(c.x,c.y,z,0.8,1,'cp');}else c.cd=0.2;}
      const z=nearestZ(c.x,c.y,12);if(z>=0){c.hp-=3*dt;if(c.hp<=0){removeCp(c.id);toast('🚧 Зомби прорвали чекпоинт','warn');}}
    }
    for(const h of S.helis){
      if(h.ph===0){const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy);h.a=Math.atan2(dy,dx);if(d<4){h.ph=1;h.t=1.4;}else{const s=Math.min(d,240*dt);h.x+=dx/d*s;h.y+=dy/d*s;}}
      else if(h.ph===1){h.t-=dt;if(!h.dropped&&h.t<0.9){h.dropped=true;for(let k=0;k<6;k++)spawnUnit(1,h.tx+rnd(-8,8),h.ty+rnd(-8,8));fx('drop',h.x,h.y);}if(h.t<=0)h.ph=2;}
      else{const dx=-80-h.x,dy=-80-h.y,d=Math.hypot(dx,dy);h.a=Math.atan2(dy,dx);if(d<5)h.dead=true;else{const s=Math.min(d,260*dt);h.x+=dx/d*s;h.y+=dy/d*s;}}
    }
    S.helis=S.helis.filter(h=>!h.dead);
  }
  function spawnUnit(type,x,y){
    if(NA>=MAXA)return -1;const i=newAgent(type,x,y);
    const n=nodeAt(x,y);ax[i]=nx[n]+rnd(-4,4);ay[i]=ny[n]+rnd(-4,4);an0[i]=-1;an1[i]=n;
    aspd[i]=type===1?rnd(30,36):rnd(26,30);return i;
  }
  function newAgent(type,x,y){
    const i=NA++;for(const k in ARR)ARR[k][i]=0;
    atype[i]=type;ax[i]=x;ay[i]=y;an0[i]=an1[i]=-1;adest[i]=-1;aplace[i]=-1;ahome[i]=awork[i]=-1;apass[i]=acp[i]=aex[i]=ain[i]=-1;atgt[i]=-1;
    alane[i]=rnd(-3.5,3.5);ahp[i]=1;athink[i]=Math.random()*0.3;return i;
  }

  // ----- баррикады и чекпоинты -----
  function placeBars(a,b){
    let n=0;
    for(let e=0;e<NE;e++){
      const h=segX(a.x,a.y,b.x,b.y,nx[ea[e]],ny[ea[e]],nx[eb[e]],ny[eb[e]]);if(!h||isExit[ea[e]]&&isExit[eb[e]])continue;
      const x=lerp(nx[ea[e]],nx[eb[e]],h[1]),y=lerp(ny[ea[e]],ny[eb[e]],h[1]);
      if(S.bars.some(o=>o&&o.e===e)||ecp[e]>=0)continue;
      if(S.money<COST.bar)break;S.money-=COST.bar;
      const ang=Math.atan2(ny[eb[e]]-ny[ea[e]],nx[eb[e]]-nx[ea[e]])+Math.PI/2;
      S.bars.push({e,x,y,ang,len:ew[e]+9,hp:60});eblock[e]++;n++;
      for(let i=0;i<NA;i++){if(atype[i]===0&&amode[i]!==1&&amode[i]!==2&&ast[i]<ACT&&edgeBetween(an0[i]>=0?an0[i]:an1[i],an1[i])===e){const t=an0[i];an0[i]=an1[i];an1[i]=t>=0?t:an1[i];}}
    }
    if(!n){toast('Проведите линию поперёк улицы (нужно $'+COST.bar+' за баррикаду)','warn');return;}
    rebuildMask();invalidate();Snd.play('wall');toast(`🧱 Баррикады: ${n} ($${n*COST.bar})`,'info');
  }
  function damageBar(id,dmg){const b=S.bars[id];if(!b)return;b.hp-=dmg;if(b.hp<=0)removeBar(id,true);}
  function removeBar(id,broken){const b=S.bars[id];if(!b)return;eblock[b.e]--;S.bars[id]=null;rebuildMask();invalidate();fx('boom',b.x,b.y);if(broken)toast('🧱 Зомби проломили баррикаду','warn');}
  function nearestEdge(x,y,r){let best=-1,bd=r,bt=0;for(let e=0;e<NE;e++){const[d,t]=distSeg(x,y,nx[ea[e]],ny[ea[e]],nx[eb[e]],ny[eb[e]]);if(d<bd){bd=d;best=e;bt=t;}}return[best,bt];}
  function makeCp(w){
    const[e,t0]=nearestEdge(w.x,w.y,16);
    if(e<0){toast('Чекпоинт ставится на улицу','warn');return;}
    if(ecp[e]>=0||eblock[e]){toast('Здесь уже стоит заграждение','warn');return;}
    if(elen[e]<26){toast('Слишком короткий участок: нужна длинная улица под очередь','warn');return;}
    if(!spend(S,COST.checkpoint))return;
    const t=clamp(t0,0.3,0.7),id=S.cps.length;
    S.cps.push({id,e,t,x:lerp(nx[ea[e]],nx[eb[e]],t),y:lerp(ny[ea[e]],ny[eb[e]],t),ang:Math.atan2(ny[eb[e]]-ny[ea[e]],nx[eb[e]]-nx[ea[e]]),q:[[],[]],proc:[0,0],hp:70,cd:0});
    ecp[e]=id;toast('🚧 Чекпоинт: досмотр ловит носителей с симптомами. Очередь — тоже риск!','info');
  }
  function removeCp(id){
    const c=S.cps[id];if(!c)return;
    for(const q of c.q)for(const i of q)if(amode[i]===3)amode[i]=0;
    ecp[c.e]=-1;S.cps[id]=null;fx('boom',c.x,c.y);
  }

  // ===================== СОЗДАНИЕ / СОХРАНЕНИЕ =====================
  function countPop(){for(const d of D)d.pop=0;for(let i=0;i<NA;i++)if(atype[i]===0&&ahome[i]>=0)D[Bd[ahome[i]].district].pop++;}
  function setup(){
    bOcc=new Int32Array(Bd.length);bInc=new Float32Array(Bd.length);invalidate();
    S.shops=Bd.map((b,k)=>b.type==='shop'?k:-1).filter(k=>k>=0);
  }
  function init(){
    NA=0;
    S={seed:(Math.random()*1e9)|0,time:6,t:0,money:1500,alert:false,zSeen:0,zVis:0,cps:[],bars:[],helis:[],fx:[],noise:[],risers:[],leak:0,mR:0,mC:0,mutT:0,
      sel:null,stats:{killed:0,caught:0,arrested:0,friendly:0,infected:0,unitsLost:0,escaped:0,collected:0,risen:0},cnt:{},night:false};
    gen(S.seed);setup();
    const homes=[],jobs=[];Bd.forEach((b,k)=>{const a=Math.max(1,Math.round(b.area/60));if(b.type==='house')for(let q=0;q<a;q++)homes.push(k);else for(let q=0;q<a;q++)jobs.push(k);});
    for(let k=0;k<NCIV;k++){
      const h=homes[Math.random()*homes.length|0],i=newAgent(0,Bd[h].cx,Bd[h].cy);
      ahome[i]=h;awork[i]=Math.random()<0.8?jobs[Math.random()*jobs.length|0]:-1;aspd[i]=rnd(16,27);
      if(Math.random()<0.04)aflag[i]|=1;  // природный иммунитет
      ain[i]=h;amode[i]=1;bOcc[h]++;aent[i]=S.time;atimer[i]=rnd(0.3,3.5)*SPH;
    }
    countPop();
    let p0;do{p0=Math.random()*NCIV|0;}while(aflag[p0]&1);
    ast[p0]=I1;astage[p0]=rnd(55,70);aflag[p0]|=8;amw[p0]=wOf(p0);bInc[ain[p0]]+=amw[p0];S.stats.infected=1;
    const pol=Bd.find(b=>b.type==='police')||Bd[0];
    for(let k=0;k<8;k++)spawnUnit(1,nx[pol.node],ny[pol.node]);
    renderMap();update(0.0001);
  }
  function save(){
    const a={};for(const k in ARR)a[k]=Array.from(ARR[k].subarray(0,NA),v=>Math.round(v*100)/100);
    return{seed:S.seed,time:S.time,t:S.t,money:S.money,alert:S.alert,zSeen:S.zSeen,leak:S.leak,mutT:S.mutT,stats:S.stats,NA,a,risers:S.risers,
      bars:S.bars.filter(Boolean).map(b=>[b.e,b.hp]),cps:S.cps.filter(Boolean).map(c=>[c.e,c.t,c.hp]),
      bt:Bd.map(b=>(b.turret?1:0)|(b.sniper?2:0)),st:ST.map(s=>s.closed?1:0),cf:D.map(d=>d.curfew?1:0)};
  }
  function load(d){
    S={seed:d.seed,time:d.time,t:d.t,money:d.money,alert:d.alert,zSeen:d.zSeen,zVis:0,cps:[],bars:[],helis:[],fx:[],noise:[],risers:d.risers||[],leak:d.leak,mR:0,mC:0,mutT:d.mutT||0,sel:null,stats:d.stats,cnt:{},night:false};
    gen(S.seed);setup();
    NA=d.NA;for(const k in ARR){const src=d.a[k];if(src)ARR[k].set(src.slice(0,NA));}
    for(let i=0;i<NA;i++){
      if(amode[i]===3)amode[i]=0;
      if(amode[i]===1){bOcc[ain[i]]++;bInc[ain[i]]+=amw[i];}
      if(amode[i]===2){S.mR++;S.mC+=amw[i];}
    }
    for(const[e,hp]of d.bars){const ang=Math.atan2(ny[eb[e]]-ny[ea[e]],nx[eb[e]]-nx[ea[e]])+Math.PI/2;S.bars.push({e,x:(nx[ea[e]]+nx[eb[e]])/2,y:(ny[ea[e]]+ny[eb[e]])/2,ang,len:ew[e]+9,hp});eblock[e]++;}
    for(const[e,t,hp]of d.cps){const id=S.cps.length;S.cps.push({id,e,t,x:lerp(nx[ea[e]],nx[eb[e]],t),y:lerp(ny[ea[e]],ny[eb[e]],t),ang:Math.atan2(ny[eb[e]]-ny[ea[e]],nx[eb[e]]-nx[ea[e]]),q:[[],[]],proc:[0,0],hp,cd:0});ecp[e]=id;}
    d.bt.forEach((f,k)=>{if(Bd[k]){Bd[k].turret=f&1;Bd[k].sniper=f&2?1:0;}});
    d.st.forEach((f,k)=>{if(ST[k])ST[k].closed=!!f;});d.cf.forEach((f,k)=>{if(D[k])D[k].curfew=!!f;});
    countPop();rebuildMask();renderMap();update(0.0001);
  }

  // ===================== ГЛАВНЫЙ ШАГ =====================
  function update(dt){
    S.t+=dt;S.time+=dt/SPH;budget=25;S.night=night();
    buildGrids();
    for(const r of S.risers){r[1]-=dt;if(r[1]<=0){const i=r[0];if(ast[i]===DEAD&&(aflag[i]&4)){aflag[i]&=~4;ast[i]=LATE;ahp[i]=Strain.has('tough')?5:3;aspd[i]=rnd(10,14);an1[i]=-1;amode[i]=0;S.stats.risen++;fx('rise',ax[i],ay[i]);}r[2]=1;}}
    if(S.risers.length&&S.risers.some(r=>r[2]))S.risers=S.risers.filter(r=>!r[2]);
    for(let i=0;i<NA;i++){
      let s=ast[i];if(s>=DEAD)continue;
      if(aflag[i]&2){amark[i]-=dt;if(amark[i]<=0)aflag[i]&=~2;}
      if(s===I1){astage[i]-=dt;if(astage[i]<=0){stageUp(i,I2);astage[i]=rnd(10,18)*fastK();s=I2;}}
      else if(s===I2){astage[i]-=dt;if(astage[i]<=0){turnActive(i);s=ACT;}}
      else if(s===ACT){astage[i]-=dt;if(astage[i]<=0){ast[i]=LATE;ahp[i]=Strain.has('tough')?5:3;aspd[i]=rnd(10,14);s=LATE;}}
      if(s===ACT||s===LATE)updZombie(i,dt);
      else if(atype[i]===1)updPolice(i,dt);
      else if(atype[i]===2)updMedic(i,dt);
      else updCiv(i,dt);
    }
    updDefense(dt);
    for(const n of S.noise)n.t-=dt;if(S.noise.length&&S.noise[0].t<=0)S.noise=S.noise.filter(n=>n.t>0);
    // подсчёт
    const c={h:0,i1:0,i2:0,act:0,late:0,dead:0,iso:0,esc:0,civZ:0,civDead:0,units:0,risers:0};
    for(let i=0;i<NA;i++){
      const s=ast[i],civ=atype[i]===0;
      if(s===HL)c.h++;else if(s===I1)c.i1++;else if(s===I2)c.i2++;else if(s===ACT)c.act++;else if(s===LATE)c.late++;else if(s===DEAD){c.dead++;if(aflag[i]&4)c.risers++;}else if(s===ISO)c.iso++;else c.esc++;
      if(civ){if(s===ACT||s===LATE)c.civZ++;if(s===DEAD)c.civDead++;}else if(s<ACT)c.units++;
    }
    S.cnt=c;S.zVis=c.act+c.late;
    let upk=0;for(const d of D)if(d.curfew)upk+=3;
    S.money+=dt*(4+(c.h+c.i1+c.i2)/280-upk);
    if(S.money<0){S.money=0;const d=D.find(d=>d.curfew);if(d){d.curfew=false;toast(`💸 Нет денег: комендантский час в районе «${d.name}» снят`,'bad');}}
    if(S.alert){S.mutT+=dt;if(S.mutT>80){S.mutT=0;Strain.add();}}
    for(const f of S.fx)f.t-=dt;if(S.fx.length&&S.fx[0].t<=0)S.fx=S.fx.filter(f=>f.t>0);
    heatT-=dt;
  }
  const lossFrac=()=>(S.cnt.civDead+S.cnt.civZ)/NCIV;
  function result(){
    if(lossFrac()>=0.5)return 'lose';
    const c=S.cnt;if(S.t>5&&c.i1+c.i2+c.act+c.late+c.risers===0)return 'win';
    return null;
  }

  // ===================== ОТРИСОВКА =====================
  function poly(g,pts){g.beginPath();for(let k=0;k<pts.length;k+=2)k?g.lineTo(pts[k],pts[k+1]):g.moveTo(pts[k],pts[k+1]);g.closePath();}
  function renderMap(){
    const sc=1.5;mapCv=document.createElement('canvas');mapCv.width=Math.round(W*sc);mapCv.height=Math.round(H*sc);
    const g=mapCv.getContext('2d');g.scale(sc,sc);const r=mulberry32(S.seed^0x9e37);
    g.fillStyle='#2a2c30';g.fillRect(0,0,W,H);
    // вода
    g.fillStyle='#0d131b';
    g.beginPath();g.moveTo(-30,-30);for(const[x,y]of coastWp)g.lineTo(x,y);g.lineTo(-30,H+30);g.closePath();g.fill();
    g.beginPath();g.moveTo(-30,H+30);for(const[x,y]of coastSp)g.lineTo(x,y);g.lineTo(W+30,H+30);g.closePath();g.fill();
    g.strokeStyle='rgba(90,130,170,0.12)';g.lineWidth=1;
    for(let k=0;k<160;k++){const x=r()*W,y=r()*H;if(!isWater(x,y)||!isWater(x+14,y))continue;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+7,y-2,x+14,y);g.stroke();}
    g.strokeStyle='#3a3e44';g.lineWidth=1.5;
    g.beginPath();for(const[x,y]of coastWp)g.lineTo(x,y);g.stroke();g.beginPath();for(const[x,y]of coastSp)g.lineTo(x,y);g.stroke();
    // парки и площади
    for(const p of parks){
      poly(g,p.pts.flat());g.fillStyle=p.kind==='park'?'#1f2b22':'#33363b';g.fill();
      if(p.kind==='park'){for(let k=0;k<22;k++){const u=r(),v=r(),x=lerp(lerp(p.pts[0][0],p.pts[1][0],u),lerp(p.pts[3][0],p.pts[2][0],u),v),y=lerp(lerp(p.pts[0][1],p.pts[1][1],u),lerp(p.pts[3][1],p.pts[2][1],u),v);g.fillStyle=r()<0.5?'#2a3d2d':'#263628';g.beginPath();g.arc(x,y,2+r()*3,0,7);g.fill();}}
      else{g.strokeStyle='rgba(255,255,255,0.05)';g.stroke();g.fillStyle='#3c4046';g.beginPath();g.arc(p.cx,p.cy,5,0,7);g.fill();}
    }
    // улицы: мосты, проспекты, переулки

      const amt=Math.min(tot,0.03*c.pop0*dt),f=amt/tot,mS=c.S*f,mE=c.E*f;

    if(S.money<0){
      S.money=0;
      const q=S.C.find(c=>c.quar)||S.C.find(c=>c.evac);
      if(q){if(q.quar){q.quar=false;toast(`💸 Нет денег: карантин «${q.name}» снят`,'bad');}else{q.evac=false;toast(`💸 Нет денег: эвакуация «${q.name}» остановлена`,'bad');}}

  function totals(){

    ctx.fill();ctx.fillStyle='#ff6b6b';ctx.beginPath();
    for(let i=0;i<NP;i++)if(pk[i]){const e=S.E[pe[i]],a=S.C[e.a],b=S.C[e.b],t=pd[i]>0?pt[i]:1-pt[i];const[x,y]=qpt(a.x,a.y,e.cx,e.cy,b.x,b.y,t);ctx.rect(x-1.5,y-1.5,3,3);}

      if(view.s>0.75||c.pop0>=100||c.id===S.sel||det>0.05){

        const t=c.name.toUpperCase()+(det>0.001?' '+pct(det):'');ctx.fillStyle=c.nuked?'#ffb070':det>0.05?'#ff9a9a':'#b9c0c7';spacedText(ctx,t,c.x,c.y-10,1);
      }
    }
    for(const f of S.fx)if(f.k==='nuke'){const k=1-f.t/f.m;ctx.fillStyle=`rgba(255,240,200,${(1-k)*0.9})`;ctx.beginPath();ctx.arc(f.x,f.y,8+k*70,0,7);ctx.fill();ctx.strokeStyle=`rgba(255,150,60,${1-k})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,10+k*110,0,7);ctx.stroke();}
  }
  function countryAt(w){
    const x=clamp(Math.floor(w.x/W*RW),0,RW-1),y=clamp(Math.floor(w.y/H*RH),0,RH-1);let id=raster[y*RW+x];
    if(id>=0)return id;let best=-1,bd=20;for(const c of S.C){const d=Math.hypot(c.x-w.x,c.y-w.y);if(d<bd){bd=d;best=c.id;}}return best;
  }
  function act(name,id){

    else if(name==='air'){if(c.airClosed){c.airClosed=false;toast('Авиасообщение восстановлено','info');}else if(spend(S,COST.air)){c.airClosed=true;toast(`✈ ${c.name}: авиалинии закрыты`,'info');}}
    else if(name==='aid'){if(c.aid>0){toast('Помощь уже идёт','warn');return;}if(spend(S,COST.aid)){c.aid=40;toast(`🤝 Международная помощь в «${c.name}» на 40 дней: войска, медики, оборудование`,'good');}}
    else if(name==='nuke'){

        c.D+=aliveOf(c)+c.Q;c.S=c.E=c.I=c.L=c.Q=0;c.nuked=true;S.nukes++;S.incomeMul*=0.7;S.panic=60;S.vac=Math.max(0,S.vac-10);
        for(const[a,b]of adj){const o=a===c.id?b:b===c.id?a:-1;if(o<0)continue;const n=S.C[o];for(const k of['S','E','I','L']){const l=n[k]*0.08;n[k]-=l;n.D+=l;}}
        S.fx.push({k:'nuke',x:c.x,y:c.y,t:3,m:3});Snd.play('nuke');toast(`☢ Ядерный удар по «${c.name}». Мир в ужасе.`,'bad');showInfo();

      <button data-act="nuke" class="danger">☢ Ядерный удар</button></div>`;
    return h;

  function hud(){

    return{chips:[

  function summary(){const t=totals();return[['Население мира',fmtPeople(S.pop0*1e6)],['Погибло',fmtPeople(t.D*1e6)],['Заражено',fmtPeople((t.E+t.I+t.L)*1e6)],
    ['Выжило здоровых',fmtPeople(t.S*1e6)],['Готовность вакцины',S.vac.toFixed(1)+'%'],['Ядерных ударов',S.nukes],['Длительность',`${Math.floor(S.time)+1} дн.`]];}
  return{id:3,name:'Земной шар',W,H,init,load,save,update,render,down,move(){},up(){},hud,result,summary,carryOut:()=>({}),infoHTML,act:n=>act(n,S.sel),
    get S(){return S;},
    legend:[['#e9ecef','самолёты и корабли'],['#ff6b6b','зомби на борту'],['#5fd38a','страна чиста'],['#e8b84a','есть очаги'],['#2bb3a0','что-то закрыто'],['#7cd84a','идёт помощь']],

const LEVELS={1:L1,2:L2,3:L3};
const App={num:1,lvl:null,speed:1,paused:false,tool:null,hover:null,over:false,carry:{},unlocked:1,started:false,best:{}};
const SAVE_KEY='karantin_save_v1';
function saveGame(){
  if(!App.lvl||!App.started)return;
  try{
    const data={unlocked:App.unlocked,num:App.num,carry:App.carry,sound:Snd.on,best:App.best,strain:Strain.list,
      snap:App.over?null:{num:App.num,data:App.lvl.save()}};
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
  }catch(e){}
}

// ----- камера -----
const cv=$('cv'),ctx=cv.getContext('2d');
const cam={s:1,ox:0,oy:0,fit:1,cw:0,ch:0,dpr:1};
function resize(){
  const r=$('wrap').getBoundingClientRect();cam.dpr=Math.min(2,window.devicePixelRatio||1);cam.cw=r.width;cam.ch=r.height;
  cv.width=Math.round(r.width*cam.dpr);cv.height=Math.round(r.height*cam.dpr);
  if(App.lvl){const of=cam.fit;cam.fit=Math.min(cam.cw/App.lvl.W,cam.ch/App.lvl.H);cam.s=Math.max(cam.fit,cam.s*(of?cam.fit/of:1));clampCam();}
}
function fitCam(){
  const L=App.lvl;cam.fit=Math.min(cam.cw/L.W,cam.ch/L.H)||1;
  cam.s=cam.cw<700?Math.max(cam.fit,Math.min(cam.ch/L.H,cam.fit*2.2)):cam.fit;
  cam.ox=(cam.cw-L.W*cam.s)/2;cam.oy=(cam.ch-L.H*cam.s)/2;clampCam();
}
function clampCam(){
  const L=App.lvl;if(!L)return;const ww=L.W*cam.s,wh=L.H*cam.s;
  cam.ox=ww<=cam.cw?(cam.cw-ww)/2:clamp(cam.ox,cam.cw-ww,0);
  cam.oy=wh<=cam.ch?(cam.ch-wh)/2:clamp(cam.oy,cam.ch-wh,0);
}
function zoomAt(sx,sy,f){const ns=clamp(cam.s*f,cam.fit,cam.fit*6),wx=(sx-cam.ox)/cam.s,wy=(sy-cam.oy)/cam.s;cam.s=ns;cam.ox=sx-wx*ns;cam.oy=sy-wy*ns;clampCam();}
const toWorld=(x,y)=>({x:(x-cam.ox)/cam.s,y:(y-cam.oy)/cam.s});

// ----- ввод: мышь и касания; два пальца — масштаб и сдвиг -----
const ptrs=new Map();let pinch=null,panning=null,downTool=false,panStart=null;
const sp=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  Snd.init();
  if(!App.lvl||App.over||ovOpen)return;
  cv.setPointerCapture(e.pointerId);const p=sp(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){
    if(downTool){App.lvl.up(toWorld(p.x,p.y),'__cancel');downTool=false;}
    panning=null;const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};return;
  }
  if(ptrs.size>2)return;
  if(e.button===1||e.button===2||App.tool==='pan'){panning=p;panStart={x:p.x,y:p.y,moved:false,sel:App.tool==='pan'&&e.button===0};return;}
  const w=toWorld(p.x,p.y);App.hover=w;
  App.lvl.down(w,App.tool);downTool=true;
});
cv.addEventListener('pointermove',e=>{
  const p=sp(e);App.hover=toWorld(p.x,p.y);
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,p);
  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.ox+=mx-pinch.mx;cam.oy+=my-pinch.my;if(pinch.d>10)zoomAt(mx,my,d/pinch.d);clampCam();pinch={d,mx,my};return;}
  if(panning){cam.ox+=p.x-panning.x;cam.oy+=p.y-panning.y;panning=p;if(panStart&&Math.hypot(p.x-panStart.x,p.y-panStart.y)>6)panStart.moved=true;clampCam();return;}
  if(downTool&&App.lvl)App.lvl.move(App.hover,App.tool,true);
});
function endPtr(e){
  const p=sp(e);
  if(downTool&&ptrs.size===1&&App.lvl&&!App.over)App.lvl.up(toWorld(p.x,p.y),App.tool);
  if(panStart&&panStart.sel&&!panStart.moved&&ptrs.size===1&&App.lvl&&App.lvl.click&&!App.over)App.lvl.click(toWorld(p.x,p.y));
  if(ptrs.size<=1)panStart=null;
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0){panning=null;downTool=false;}
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!ptrs.size)App.hover=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=sp(e);zoomAt(p.x,p.y,e.deltaY<0?1.15:1/1.15);},{passive:false});
window.addEventListener('resize',resize);

function buildTools(){
  const box=$('tools');box.innerHTML='';
  App.lvl.tools.forEach((t,idx)=>{
    const b=document.createElement('button');b.className='tool';b.dataset.tool=t.id;b.title=t.hint;
    b.innerHTML=`${idx<9?`<kbd>${idx+1}</kbd>`:''}<span class="i">${t.icon}</span><small>${t.name}</small>${t.cost?`<em>$${t.cost}${t.unit||''}</em>`:''}`;
    b.onclick=()=>{Snd.init();Snd.play('click');
      if(t.instant){App.lvl.act(t.id);return;}
      setTool(t.id);};
    box.appendChild(b);
  });
  setTool(App.lvl.tools[App.lvl.id===1?1:0].id);
}

  App.tool=id;const t=App.lvl.tools.find(x=>x.id===id);

  $('hint').textContent=t?t.icon+' '+t.hint:'';cv.style.cursor=id==='pan'?'grab':'crosshair';

window.addEventListener('keydown',e=>{

const RULES=`<p>Вы руководите экстренной службой. Вирус нужно остановить на трёх масштабах подряд. Если на уровне инфекция побеждает, она вырывается дальше: город → регион → земной шар.</p>

<li><b>Вирус мутирует</b> примерно раз в полторы минуты: бегуны, бессимптомность, стайность и другие. Мутации переходят на следующие уровни.</li>
<li><b>Город.</b> 2000 жителей живут по распорядку: дом, работа, магазины, парки, метро. Ночью зомби опаснее, шум стрельбы их приманивает. В панике люди бегут из города через мосты и уносят вирус в регион.</li>
<li><b>Инструменты города:</b> турели, снайперы, вертолёт с полицией, баррикады, чекпоинты с очередями, экспресс-тесты, санитары, комендантский час по районам, закрытие станций метро.</li>
<li><b>Регион:</b> блокпосты, перекрытие ж/д, аэропорты, эвакуация, карантин, войска, оповещение, авианалёт. <b>Земной шар:</b> границы, порты, авиалинии, помощь, вакцина, ядерный удар.</li>
</ul>
<div class="keys">ЛКМ или касание — инструмент · колесо или два пальца — масштаб · ПКМ или ✋ — сдвиг, клик ✋ — выбор района<br>1–9 — инструменты · Пробел — пауза · Esc — меню</div>`;
function showStart(){
  const sv=readSave();
  const cont=sv&&sv.snap?`<button class="big" id="sCont">Продолжить: уровень ${sv.snap.num}</button>`:'';
  const unl=sv?sv.unlocked:1;
  openOv(`<h1>КАРАН<em>ТИН</em></h1><div class="sub">Экстренная служба · протокол «Зомби»</div>${RULES}
    ${cont}<button class="big ${cont?'alt':''}" id="sNew">Новая игра</button>
    <div class="lvlcards">${[1,2,3].map(n=>`<button data-l="${n}" ${n>unl?'disabled':''}><b>${n}. ${LEVELS[n].name}</b><span class="tag">${n<=unl?'открыт':'закрыт'}</span>${sv&&sv.best&&sv.best[n]?`<span class="tag">${sv.best[n]}</span>`:''}</button>`).join('')}</div>`);
  if(sv){App.unlocked=sv.unlocked||1;App.carry=sv.carry||{};App.best=sv.best||{};Snd.on=sv.sound!==false;Strain.list=sv.strain||[];}
  if(cont)$('sCont').onclick=()=>{Snd.init();closeOv();startLevel(sv.snap.num,sv.snap.data);};
  $('sNew').onclick=()=>{Snd.init();closeOv();App.carry={};Strain.list=[];startLevel(1);};
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{Snd.init();closeOv();startLevel(+b.dataset.l);});
}
function showMenu(){
  if(!App.started){showStart();return;}
  App.paused=true;saveGame();updateHud(true);
  openOv(`<h2>Пауза</h2><p>Уровень ${App.num}: ${App.lvl.name}. Прогресс сохранён в браузере.</p>
    <button class="big" id="mRes">Продолжить</button><button class="big alt" id="mRestart">Перезапустить уровень</button><button class="big alt" id="mMain">Главное меню</button><button class="big alt" id="mHelp">Как играть</button>`);
  $('mRes').onclick=()=>{closeOv();App.paused=false;};
  $('mRestart').onclick=()=>{closeOv();startLevel(App.num);};
  $('mMain').onclick=()=>{saveGame();showStart();};
  $('mHelp').onclick=()=>{openOv(`<h2>Как играть</h2>${RULES}<button class="big" id="hBack">Назад</button>`);$('hBack').onclick=showMenu;};
}
function setLegend(){$('legend').innerHTML=(App.lvl.legend||[]).map(([c,t])=>`<div><span style="background:${c}"></span>${t}</div>`).join('');}
function startLevel(n,snap){
  if(!snap&&n===1)Strain.list=[];
  App.num=n;App.lvl=LEVELS[n];App.over=false;App.paused=false;App.started=true;$('toasts').innerHTML='';
  if(snap)App.lvl.load(snap);else App.lvl.init(n===1?null:App.carry[n]);
  App.unlocked=Math.max(App.unlocked,n);
  $('info').hidden=true;resize();fitCam();buildTools();updateHud(true);setLegend();
  toast(`Уровень ${n}: ${App.lvl.name}. ${App.lvl.intro}`,'info');Snd.play('alarm');
  saveGame();
}
function endLevel(res){
  App.over=true;const n=App.num,L=App.lvl;
  const rows=L.summary().map(r=>`<div>${r[0]}</div><div>${r[1]}</div>`).join('');
  if(res==='win'){
    App.best[n]='победа';Snd.play('good');
    const next=n<3?`<button class="big alt" id="eNext">Сценарий «а если бы не удалось»: уровень ${n+1}</button>`:'';
    if(n<3){App.carry[n+1]=null;App.unlocked=Math.max(App.unlocked,n+1);}
    openOv(`<h2>${n===3?'Человечество спасено':n===2?'Регион удержан':'Вспышка подавлена'}</h2>
      <p>${n===3?(L.S.vac>=100?'Вакцина готова, начинается массовая вакцинация.':'Пандемия остановлена.'):'Все заражённые уничтожены. Вирус не вышел за пределы '+(n===1?'города':'региона')+'.'}</p>
      <div class="stats">${rows}</div><button class="big" id="eMain">Главное меню</button>${next}`);
    $('eMain').onclick=showStart;
    if(next)$('eNext').onclick=()=>{closeOv();startLevel(n+1);};
  }else{
    Snd.play('bad');
    if(n<3){
      App.carry[n+1]=L.carryOut();App.unlocked=Math.max(App.unlocked,n+1);App.best[n]=App.best[n]||'прорыв';
      openOv(`<h2>${n===1?'Город потерян':'Регион потерян'}</h2>
        <p>${n===1?'Половина города погибла или обратилась. Беженцы и скрытые носители уже на трассах.':'Половина региона заражена или погибла. Вирус пересекает границы.'} Масштаб растёт.</p>
        <div class="stats">${rows}</div><button class="big" id="eNext">Уровень ${n+1}: ${LEVELS[n+1].name}</button><button class="big alt" id="eRetry">Переиграть уровень ${n}</button>`);
      $('eNext').onclick=()=>{closeOv();startLevel(n+1);};
      $('eRetry').onclick=()=>{closeOv();startLevel(n);};
    }else{
      App.best[3]=App.best[3]||'поражение';
      openOv(`<h2>Человечество пало</h2><p>Больше 90% людей заражены или погибли.</p><div class="stats">${rows}</div>
        <button class="big" id="eRetry">Переиграть уровень 3</button><button class="big alt" id="eMain">Главное меню</button>`);
      $('eRetry').onclick=()=>{closeOv();startLevel(3);};$('eMain').onclick=showStart;
    }
  }
  saveGame();
}

// ----- главный цикл: фиксированные подшаги симуляции, отрисовка каждый кадр -----
let lastT=performance.now(),autoT=0;
function frame(now){
  const rdt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  const L=App.lvl;
  if(L&&App.started&&!App.over&&!App.paused&&!ovOpen){
    for(let k=0;k<App.speed;k++){L.update(rdt);const r=L.result();if(r){endLevel(r);break;}}
    autoT+=rdt;if(autoT>15){autoT=0;saveGame();}
  }
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0a0e11';ctx.fillRect(0,0,cv.width,cv.height);
  if(L&&L.S){
    ctx.setTransform(cam.dpr*cam.s,0,0,cam.dpr*cam.s,cam.dpr*cam.ox,cam.dpr*cam.oy);
    L.render(ctx,cam,rdt);
    if(App.paused&&!ovOpen){ctx.setTransform(cam.dpr,0,0,cam.dpr,0,0);ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,cam.cw,cam.ch);ctx.fillStyle='#fff';ctx.font='bold 26px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('⏸ ПАУЗА',cam.cw/2,cam.ch/2);}
  }
  updateHud(false);
  requestAnimationFrame(frame);
}
resize();
// фоном показываем город, пока открыто стартовое меню
App.lvl=L1;L1.init();fitCam();buildTools();updateHud(true);setLegend();
showStart();
requestAnimationFrame(frame);
window.__kar={App,L1,L2,L3,startLevel};
</script>
